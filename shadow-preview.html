<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=8, user-scalable=yes" />
<title>H.A.N.K. Shadow Preview</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f8fafc}
#notice{position:fixed;left:12px;bottom:12px;z-index:999999;background:rgba(255,255,255,.9);color:#0f172a;border:1px solid rgba(15,23,42,.18);border-radius:14px;padding:8px 10px;font-size:12px;box-shadow:0 10px 30px rgba(15,23,42,.18);backdrop-filter:blur(8px)}
#notice b{color:#020617}
</style>
</head>
<body>
<iframe id="frame" src="./index.html"></iframe>
<div id="notice"><b>white-shadow branch</b> · selected square extrudes into a stacked isotope column</div>
<script>
const frame=document.getElementById('frame');
function patchShadowPreview(){
  const doc=frame.contentDocument;
  const win=frame.contentWindow;
  if(!doc||!win)return;

  if(!doc.getElementById('white-shadow-style')){
    const style=doc.createElement('style');
    style.id='white-shadow-style';
    style.textContent=`
      html,body{background:#f8fafc!important;color:#0f172a!important;}
      canvas#c{background:radial-gradient(circle at 18% 8%,rgba(191,219,254,.55),transparent 34%),radial-gradient(circle at 82% 78%,rgba(221,214,254,.45),transparent 36%),#f8fafc!important;}
      #top,#bottom,#hud,#info{background:rgba(255,255,255,.88)!important;border-color:rgba(15,23,42,.18)!important;color:#0f172a!important;box-shadow:0 12px 36px rgba(15,23,42,.13)!important;}
      button,select{background:#ffffff!important;color:#0f172a!important;border-color:#94a3b8!important;}
      button.active{border-color:#0284c7!important;box-shadow:0 0 0 1px rgba(2,132,199,.35) inset!important;}
      label,.status,.detail span:first-child,.map-help,.map-title span:last-child,#hud{color:#475569!important;}
      h1,#info h2,.detail span:last-child,.mode b,.map-help b{color:#0f172a!important;}
      .eyebrow,.group-title,details.group summary,.value{color:#0369a1!important;}
      .group{background:rgba(241,245,249,.82)!important;border-color:rgba(15,23,42,.18)!important;}
      #miniMap{background:#f1f5f9!important;border-color:rgba(15,23,42,.22)!important;}
    `;
    doc.head.appendChild(style);
  }

  if(win.__hankShadowPreviewPatch)return;
  win.__hankShadowPreviewPatch=true;

  const injected=doc.createElement('script');
  injected.textContent=String.raw`
    if(!window.__hankZNPlanePatch){
      window.__hankZNPlanePatch=true;
      const oldDrawAxes=drawAxes;

      function planeColorForNuclide(n){
        const level=n.stable?0:instability(n);
        return 'hsl('+(275*level)+' 92% '+(n.stable?58:62)+'%)';
      }

      function projectCellCornersAt(n,y){
        const hx=S.zScale*.42, hz=S.nScale*.42;
        return [
          projectObj({x:n.x-hx,y,z:n.z-hz}),
          projectObj({x:n.x+hx,y,z:n.z-hz}),
          projectObj({x:n.x+hx,y,z:n.z+hz}),
          projectObj({x:n.x-hx,y,z:n.z+hz})
        ];
      }

      function drawPoly(pts,fill,stroke,alpha){
        ctx.save();
        ctx.globalAlpha=alpha;
        ctx.beginPath();
        ctx.moveTo(pts[0].x,pts[0].y);
        for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
        ctx.closePath();
        ctx.fillStyle=fill;
        ctx.fill();
        ctx.globalAlpha=Math.min(1,alpha+.18);
        ctx.strokeStyle=stroke;
        ctx.lineWidth=1;
        ctx.stroke();
        ctx.restore();
      }

      function pctNumber(v){
        if(!v)return NaN;
        const n=Number(String(v).replace('%','').trim());
        if(!isFinite(n))return NaN;
        return n>1?n/100:n;
      }

      function decayColor(mode,i){
        const m=String(mode||'').toLowerCase();
        if(/stable/.test(m))return '#ef4444';
        if(/alpha|α|(^|\W)a($|\W)/.test(m))return '#f97316';
        if(/b-|beta-|β-/.test(m))return '#0ea5e9';
        if(/b\+|beta\+|β\+|ec|electron/.test(m))return '#d946ef';
        if(/sf|fission/.test(m))return '#22c55e';
        return ['#06b6d4','#8b5cf6','#eab308','#14b8a6'][i%4];
      }

      function selectedModes(n){
        if(n.stable)return [{mode:'Stable',prob:1,color:'#ef4444'}];
        const raw=(n.modes&&n.modes.length?n.modes:[{mode:n.decay||'Unknown',prob:''}]);
        let items=raw.map((m,i)=>({mode:m.mode||'Unknown',prob:pctNumber(m.prob),color:decayColor(m.mode,i)}));
        let known=items.filter(x=>isFinite(x.prob)&&x.prob>0).reduce((s,x)=>s+x.prob,0);
        if(known>0){
          items.forEach(x=>{if(!isFinite(x.prob)||x.prob<=0)x.prob=Math.max(0,(1-known)/(items.length-1||1));});
        }else{
          items.forEach(x=>x.prob=1/items.length);
        }
        const total=items.reduce((s,x)=>s+x.prob,0)||1;
        items.forEach(x=>x.prob=x.prob/total);
        return items;
      }

      function shade(hex,amt){
        const h=hex.replace('#','');
        const n=parseInt(h,16);
        let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
        r=Math.max(0,Math.min(255,Math.round(r+amt)));
        g=Math.max(0,Math.min(255,Math.round(g+amt)));
        b=Math.max(0,Math.min(255,Math.round(b+amt)));
        return 'rgb('+r+','+g+','+b+')';
      }

      function drawIsotopeFloorLabel(n,base){
        const label=n.label();
        ctx.save();
        ctx.font='700 14px system-ui';
        ctx.textAlign='center';
        ctx.textBaseline='middle';
        const w=ctx.measureText(label).width+18, h=22, lx=base.x, ly=base.y+18;
        ctx.fillStyle='rgba(255,255,255,.88)';
        ctx.strokeStyle='rgba(15,23,42,.42)';
        ctx.lineWidth=1;
        ctx.beginPath();
        if(ctx.roundRect)ctx.roundRect(lx-w/2,ly-h/2,w,h,8);else ctx.rect(lx-w/2,ly-h/2,w,h);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle='#0f172a';
        ctx.fillText(label,lx,ly+1);
        ctx.restore();
      }

      function faceDepth(face){return face.reduce((s,p)=>s+(p.depth||0),0)/face.length;}

      function drawSelectedColumn(n){
        if(!n||!visible(n))return;
        const baseCenter=projectObj({x:n.x,y:0,z:n.z});
        let heightY=n.y;
        if(Math.abs(heightY)<18)heightY=-18/S.zoom;
        const modes=selectedModes(n);
        let t0=0;
        const faces=[];

        for(let i=0;i<modes.length;i++){
          const t1=i===modes.length-1?1:t0+modes[i].prob;
          const lower=projectCellCornersAt(n,heightY*t0);
          const upper=projectCellCornersAt(n,heightY*t1);
          const baseColor=modes[i].color;
          for(let f=0;f<4;f++){
            const next=(f+1)%4;
            const pts=[lower[f],lower[next],upper[next],upper[f]];
            const light=f===0?20:f===1?0:f===2?-28:-12;
            faces.push({pts,depth:faceDepth(pts),fill:shade(baseColor,light),alpha:.62});
          }
          if(i===modes.length-1){
            faces.push({pts:upper,depth:faceDepth(upper)+999,fill:shade(baseColor,35),alpha:.82});
          }
          t0=t1;
        }

        ctx.save();
        ctx.lineJoin='round';
        faces.sort((a,b)=>a.depth-b.depth);
        for(const face of faces)drawPoly(face.pts,face.fill,'rgba(15,23,42,.35)',face.alpha);
        ctx.restore();

        const topCenter=projectObj({x:n.x,y:heightY,z:n.z});
        ctx.save();
        ctx.strokeStyle='rgba(15,23,42,.55)';
        ctx.lineWidth=1.5;
        ctx.beginPath();
        ctx.arc(topCenter.x,topCenter.y,6,0,Math.PI*2);
        ctx.stroke();
        ctx.restore();

        drawIsotopeFloorLabel(n,baseCenter);
      }

      function drawZNPlane(){
        const cells=S.nodes.filter(n=>visible(n)).sort((a,b)=>a.N-b.N||a.Z-b.Z);
        ctx.save();
        ctx.lineJoin='round';
        for(const n of cells){
          drawPoly(projectCellCornersAt(n,0),planeColorForNuclide(n),'rgba(15,23,42,.22)',n.stable?.52:.42);
        }
        ctx.restore();
        if(S.sel)drawSelectedColumn(S.sel);
      }

      drawAxes=function(){
        drawZNPlane();
        oldDrawAxes();
      };
    }
  `;
  doc.body.appendChild(injected);

  const proto=win.CanvasRenderingContext2D.prototype;
  const originalArc=proto.arc;
  const originalFill=proto.fill;
  const originalFillText=proto.fillText;
  const originalBeginPath=proto.beginPath;

  proto.beginPath=function(){this.__hankLastArc=null;return originalBeginPath.apply(this,arguments)};
  proto.arc=function(x,y,r,s,e,ccw){
    this.__hankLastArc={x,y,r};
    return originalArc.apply(this,arguments);
  };

  proto.fill=function(){
    const arc=this.__hankLastArc;
    const canvasId=this.canvas&&this.canvas.id;
    const fill=String(this.fillStyle||'');
    const looksLikeNuclideCircle=canvasId==='c'&&arc&&arc.r>=2.5&&arc.r<=18&&fill.startsWith('hsl(');
    const result=originalFill.apply(this,arguments);
    if(looksLikeNuclideCircle){
      const cw=this.canvas.clientWidth||this.canvas.width;
      const centerBias=(arc.x-cw/2)/(cw/2||1);
      const pseudoDepth=Math.max(0,Math.min(1,(centerBias+1)/2));
      const offsetX=8+centerBias*10;
      const offsetY=8+pseudoDepth*8;
      const alpha=.08+pseudoDepth*.14;

      this.save();
      this.globalCompositeOperation='destination-over';
      this.globalAlpha=alpha;
      this.fillStyle='rgba(15,23,42,.55)';
      originalBeginPath.call(this);
      this.ellipse(arc.x+offsetX,arc.y+offsetY,arc.r*1.45,arc.r*.55,0,0,Math.PI*2);
      originalFill.call(this);
      this.restore();

      this.save();
      this.globalAlpha=.55;
      this.fillStyle='rgba(255,255,255,.72)';
      originalBeginPath.call(this);
      this.arc(arc.x-arc.r*.35,arc.y-arc.r*.38,Math.max(1.5,arc.r*.26),0,Math.PI*2);
      originalFill.call(this);
      this.restore();
    }
    return result;
  };

  proto.fillText=function(text,x,y,maxWidth){
    const canvasId=this.canvas&&this.canvas.id;
    const oldFill=this.fillStyle;
    const labelLike=/^[A-Z][a-z]?-\d+$/.test(String(text));
    const axisLike=['Z →','N into screen','less stable ↑','Z','N'].includes(String(text));
    if(canvasId==='c'&&(labelLike||axisLike))this.fillStyle='#0f172a';
    if(canvasId==='miniMap'&&axisLike)this.fillStyle='#0f172a';
    const result=arguments.length>3?originalFillText.call(this,text,x,y,maxWidth):originalFillText.call(this,text,x,y);
    this.fillStyle=oldFill;
    return result;
  };
}
frame.addEventListener('load',()=>{setTimeout(patchShadowPreview,100);setTimeout(patchShadowPreview,500);setTimeout(patchShadowPreview,1200);});
</script>
</body>
</html>
