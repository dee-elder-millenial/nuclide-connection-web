<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=8, user-scalable=yes">
<title>H.A.N.K. - Abundance Height Mode</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#020205;color:#f4f7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#020205}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:#7dd3fc;font-weight:900;letter-spacing:.08em;text-transform:uppercase;background:#020205;z-index:5}
</style>
</head>
<body>
<div id="loading">Loading H.A.N.K. abundance mode…</div>
<iframe id="app" src="./index.html" title="H.A.N.K. abundance mode"></iframe>
<script>
const BUILD_CODE='Z7R2';
const frame=document.getElementById('app');
const loading=document.getElementById('loading');
frame.addEventListener('load',()=>{
  loading.style.display='none';
  const doc=frame.contentDocument;
  if(!doc)return;
  const patch=doc.createElement('script');
  patch.textContent = String.raw`
(function(){
  const BUILD_CODE='Z7R2';
  const DATA_URL='https://raw.githubusercontent.com/posit-dev/great-tables/main/great_tables/data/16-nuclides.csv';

  function abundanceValue(n){
    const raw=n&&n.abundanceRaw;
    const v=Number(raw);
    return isFinite(v)&&v>0?Math.max(0,Math.min(1,v)):0;
  }
  function abundancePct(n){
    const v=abundanceValue(n);
    return v>0?(v*100).toPrecision(5)+'%':'—';
  }
  function parseCSV2(t){
    let rows=[],row=[],cell='',q=false;
    for(let i=0;i<t.length;i++){
      let ch=t[i],n=t[i+1];
      if(q){
        if(ch==='"'&&n==='"'){cell+='"';i++}
        else if(ch==='"')q=false;
        else cell+=ch;
      }else{
        if(ch==='"')q=true;
        else if(ch===','){row.push(cell);cell=''}
        else if(ch==='\n'||ch==='\r'){
          if(ch==='\r'&&n==='\n')i++;
          row.push(cell);
          if(row.some(v=>String(v).trim()))rows.push(row);
          row=[];cell='';
        }else cell+=ch;
      }
    }
    row.push(cell);
    if(row.some(v=>String(v).trim()))rows.push(row);
    const h=rows.shift().map(v=>v.trim());
    return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()])));
  }
  async function fetchAbundanceMap(){
    const res=await fetch(DATA_URL,{cache:'no-store'});
    const text=await res.text();
    const rows=parseCSV2(text);
    const map=new Map();
    for(const r of rows){
      const z=Number(r.z), n=Number(r.n), a=Number(r.abundance);
      if(isFinite(z)&&isFinite(n)&&isFinite(a)&&a>0)map.set(z+','+n,a);
    }
    return map;
  }

  async function install(){
    if(typeof S==='undefined'||!S.nodes||!S.nodes.length||typeof layoutAll!=='function'){
      setTimeout(install,80);
      return;
    }

    let abundanceMap=new Map();
    try{ abundanceMap=await fetchAbundanceMap(); }
    catch(err){ console.warn('Could not fetch abundance CSV',err); }

    for(const n of S.nodes){
      const val=abundanceMap.get(n.Z+','+n.N);
      n.abundanceRaw=isFinite(val)?String(val):'';
      n.abundance=isFinite(val)?val:0;
      if(n.abundance>0)n.isNatural=true;
    }

    const selector=document.getElementById('heightMode');
    if(selector&&!selector.querySelector('option[value="abundance"]')){
      const opt=document.createElement('option');
      opt.value='abundance';
      opt.textContent='Natural abundance';
      selector.appendChild(opt);
    }

    const badge=document.createElement('div');
    badge.textContent='BUILD '+BUILD_CODE;
    badge.style.cssText='position:fixed;top:8px;right:10px;z-index:99;background:rgba(15,23,42,.9);border:1px solid rgba(125,211,252,.6);border-radius:10px;padding:5px 8px;color:#7dd3fc;font:800 11px system-ui;letter-spacing:.06em;pointer-events:none';
    document.body.appendChild(badge);

    const oldHeightValue=heightValue;
    heightValue=function(n){
      if(S.heightMode==='abundance')return abundanceValue(n);
      return oldHeightValue(n);
    };

    const oldLayoutAll=layoutAll;
    layoutAll=function(){
      if(S.heightMode==='abundance'){
        const cz=(S.aMinZ+S.aMaxZ)/2,cn=(S.aMinN+S.aMaxN)/2;
        for(const n of S.nodes){
          n.x=(n.Z-cz)*S.zScale;
          n.z=(n.N-cn)*S.nScale;
          n.y=-abundanceValue(n)*S.yScale;
        }
        for(const r of S.reactions){
          const all=[...r.reactants,...r.products];
          r.x=all.reduce((s,o)=>s+o.x,0)/Math.max(1,all.length);
          r.z=all.reduce((s,o)=>s+o.z,0)/Math.max(1,all.length);
          r.y=all.reduce((s,o)=>s+o.y,0)/Math.max(1,all.length)-42-(r.category==='alpha capture'?24:0);
        }
        if(typeof setPanelVars==='function')setPanelVars();
      }else oldLayoutAll();
    };

    const oldDrawAxes=drawAxes;
    drawAxes=function(){
      if(S.heightMode!=='abundance')return oldDrawAxes();
      let p0=projectObj({x:-500,y:0,z:-500}),px=projectObj({x:500,y:0,z:-500}),pz=projectObj({x:-500,y:0,z:500}),py=projectObj({x:-500,y:-S.yScale,z:-500});
      ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(px.x,px.y);ctx.moveTo(p0.x,p0.y);ctx.lineTo(pz.x,pz.y);ctx.moveTo(p0.x,p0.y);ctx.lineTo(py.x,py.y);ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.55)';ctx.font='12px system-ui';ctx.fillText('Z →',px.x+8,px.y);ctx.fillText('N into screen',pz.x+8,pz.y);ctx.fillText('higher natural abundance ↑',py.x+8,py.y);
    };

    const oldHeightRows=heightRows;
    heightRows=function(n){
      if(S.heightMode!=='abundance')return oldHeightRows(n);
      return '<div class=detail><span>Height mode</span><span>Natural abundance</span></div><div class=detail><span>Natural abundance</span><span>'+esc(abundancePct(n))+'</span></div><div class=detail><span>Height note</span><span>Height equals this isotope\'s fraction of naturally occurring '+esc(n.sym)+'. Unknown or synthetic isotopes sit on the floor.</span></div>';
    };

    const oldUpdateUI=updateUI;
    updateUI=function(){
      oldUpdateUI();
      if(S.heightMode==='abundance'){
        hud.innerHTML=hud.innerHTML.replace(/Height: <b>.*?<\/b>/,'Height: <b>Natural abundance</b>');
      }
    };

    const oldNodeColor=nodeColor;
    nodeColor=function(n){
      if(S.heightMode==='abundance'){
        const v=abundanceValue(n);
        if(v<=0)return 'hsl(230 20% 28%)';
        const light=34+Math.min(34,v*44);
        return 'hsl(145 90% '+light+'%)';
      }
      return oldNodeColor(n);
    };

    const oldFloorColor=floorColor;
    floorColor=function(n){
      if(S.heightMode==='abundance'){
        const v=abundanceValue(n);
        if(v<=0)return 'hsl(230 18% 20%)';
        const light=30+Math.min(32,v*42);
        return 'hsl(145 80% '+light+'%)';
      }
      return oldFloorColor(n);
    };

    if(selector){
      selector.onchange=()=>{S.heightMode=selector.value;if(S.heightMode==='decayEnergy')recalcMaxDecayEnergy();layoutAll();setPanelVars();};
    }
    layoutAll();
  }
  install();
})();`;
  doc.body.appendChild(patch);
});
</script>
</body>
</html>
