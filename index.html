<!doctype html>
<html lang="en">
<head>

<title>Nuclide Connection Web</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#020205;color:#f4f7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;background:radial-gradient(circle at 20% 10%,rgba(55,75,135,.25),transparent 32%),radial-gradient(circle at 80% 75%,rgba(95,20,110,.20),transparent 35%),#020205}#top,#bottom{position:fixed;left:0;right:0;z-index:2;background:rgba(2,2,5,.92);backdrop-filter:blur(8px);border-color:#1d2335;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}#top{top:0;border-bottom:1px solid #1d2335}#bottom{bottom:0;border-top:1px solid #1d2335}h1{font-size:18px;margin:0 12px 0 0}button,select{background:#111827;color:#f4f7ff;border:1px solid #334155;border-radius:10px;padding:7px 10px;cursor:pointer}button.active{border-color:#7dd3fc;box-shadow:0 0 0 1px #7dd3fc inset}button.running{border-color:#facc15;color:#fef3c7}label{font-size:12px;color:#a9b0c2}input[type=range]{width:210px}#hud,#info{position:fixed;z-index:1;background:rgba(9,10,16,.86);border:1px solid #20263a;border-radius:18px;padding:12px 14px;backdrop-filter:blur(10px)}#hud{top:72px;left:14px;max-width:900px;color:#a9b0c2;font-size:13px;pointer-events:none}#hud b{color:white}#info{top:72px;right:14px;width:380px;max-width:calc(100vw - 28px);max-height:calc(100vh - 150px);overflow:auto}#info h2{font-size:34px;margin:2px 0}.eyebrow{color:#7dd3fc;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.status{color:#a9b0c2;margin-bottom:10px}.detail{display:grid;grid-template-columns:128px 1fr;gap:10px;border-top:1px solid rgba(255,255,255,.08);padding:7px 0;font-size:14px}.detail span:first-child{color:#a9b0c2;font-size:12px}.mode{display:flex;justify-content:space-between;gap:10px;border-top:1px solid rgba(255,255,255,.08);padding:7px 0;font-size:14px}.line{display:inline-block;width:24px;height:3px;border-radius:99px;margin:0 4px;vertical-align:middle}@media(max-width:850px){#info{top:auto;bottom:116px;left:14px;right:14px;width:auto;max-height:230px}#bottom{display:grid;grid-template-columns:1fr}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top"><h1>Nuclide Connection Web</h1><button id="move" class="active">Move</button><button id="orbit">Orbit</button><button id="pan">Pan</button><button id="resetL">Reset layout</button><button id="resetV">Reset view</button><button id="sweepBtn">Animate sweep</button><label>Links <select id="filter"><option value="all">All</option><option value="isotope">Isotope chains</option><option value="beta-">Beta−</option><option value="beta+/ec">Beta+/EC</option><option value="alpha">Alpha</option></select></label><label><input id="labels" type="checkbox" checked> Labels</label></div>
<div id="hud"></div>
<div id="info"><div class="eyebrow">Selection</div><h2>None</h2><div class="status">Click a nuclide node.</div><div class="detail"><span>Tip</span><span>Sweep fades nodes in/out at settled force-web positions.</span></div></div>
<div id="bottom"><label>Z min <input id="zmin" type="range"></label><label>Z max <input id="zmax" type="range"></label><label>N min <input id="nmin" type="range"></label><label>N max <input id="nmax" type="range"></label><span id="rangeText" style="color:#a9b0c2;font-size:13px"></span></div>
<script>
const DATA_URL='https://raw.githubusercontent.com/posit-dev/great-tables/main/great_tables/data/16-nuclides.csv';
const c=document.getElementById('c'),ctx=c.getContext('2d'),hud=document.getElementById('hud'),info=document.getElementById('info');
let S={nodes:[],links:[],by:new Map(),mode:'move',filter:'all',labels:true,sel:null,hover:null,drag:null,zoom:.95,panX:0,panY:0,rx:-.35,ry:.55,down:false,orbiting:false,panning:false,lastX:0,lastY:0,minZ:0,maxZ:1,minN:0,maxN:1,aMinZ:0,aMaxZ:10,aMinN:0,aMaxN:10,sweep:null,fadeIn:new Map(),fadeOut:new Map(),fadeMs:650,freeze:false,lastVisible:new Set()};
function parseCSV(t){let rows=[],row=[],cell='',q=false;for(let i=0;i<t.length;i++){let ch=t[i],n=t[i+1];if(q){if(ch=='"'&&n=='"'){cell+='"';i++}else if(ch=='"')q=false;else cell+=ch}else{if(ch=='"')q=true;else if(ch==','){row.push(cell);cell=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&n=='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell=''}else cell+=ch}}row.push(cell);if(row.some(v=>v.trim()))rows.push(row);let h=rows.shift().map(v=>v.trim());return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()])))}
function pct(v){if(v==null||String(v).trim()==='')return '';let n=Number(v);if(!isFinite(n))return String(v);return n<=1?(n*100).toPrecision(4)+'%':n.toPrecision(4)+'%'}
function rowModes(r,stable){if(stable)return[{mode:'Stable',prob:'100%'}];let out=[];for(let i=1;i<=3;i++){let d=(r['decay_'+i]||'').trim();if(d)out.push({mode:d,prob:pct(r['decay_'+i+'_pct'])})}return out.length?out:[{mode:(r.decay||'Unknown / not listed'),prob:''}]}
function load(text){let rows=parseCSV(text),seen=new Set();S.nodes=[];S.by=new Map();for(let r of rows){let Z=+r.z,N=+r.n,A=Z+N,sym=r.element,el=sym,stableText=r.is_stable,decay=r.decay_1||'',half=r.half_life||'';if(!isFinite(Z)){Z=+r.Z;N=+r.N;A=+r.A||Z+N;sym=r.symbol;el=r.element||sym;stableText=r.stable;decay=r.decay||'';half=r.half_life||''}if(!sym||Z<0||N<0)continue;let key=Z+','+N;if(seen.has(key))continue;seen.add(key);let stable=/true|yes|stable/i.test(stableText)||/^stable$/i.test(decay);if(stable){decay='Stable';half='Stable'}let node={Z,N,A,sym,el,stable,decay,half,modes:rowModes(r,stable),x:0,y:0,z:0,vx:0,vy:0,vz:0,sx:0,sy:0,depth:0,label(){return this.sym+'-'+this.A},rad(){return this.stable?9:7},key(){return this.Z+','+this.N}};S.nodes.push(node);S.by.set(key,node)}setBounds();buildLinks();setupSliders();resetLayout();resetView()}
function setBounds(){S.minZ=Math.min(...S.nodes.map(n=>n.Z));S.maxZ=Math.max(...S.nodes.map(n=>n.Z));S.minN=Math.min(...S.nodes.map(n=>n.N));S.maxN=Math.max(...S.nodes.map(n=>n.N));S.aMinZ=S.minZ;S.aMaxZ=Math.min(10,S.maxZ);S.aMinN=S.minN;S.aMaxN=Math.min(10,S.maxN)}
function buildLinks(){S.links=[];let seen=new Set();for(let n of S.nodes){add(n,S.by.get(n.Z+','+(n.N+1)),'isotope',seen);let b=S.by.get((n.Z+1)+','+(n.N-1));if(b&&b.A===n.A)add(n,b,'beta-',seen);b=S.by.get((n.Z-1)+','+(n.N+1));if(b&&b.A===n.A)add(n,b,'beta+/ec',seen);b=S.by.get((n.Z-2)+','+(n.N-2));if(b&&n.A-b.A===4)add(n,b,'alpha',seen)}}
function add(a,b,type,seen){if(!a||!b)return;let k=a.key()+'|'+b.key()+'|'+type,kr=b.key()+'|'+a.key()+'|'+type;if(seen.has(k)||seen.has(kr))return;seen.add(k);S.links.push({a,b,type})}
function setupSliders(){for(let [id,min,max,val] of [['zmin',S.minZ,S.maxZ,S.aMinZ],['zmax',S.minZ,S.maxZ,S.aMaxZ],['nmin',S.minN,S.maxN,S.aMinN],['nmax',S.minN,S.maxN,S.aMaxN]]){let e=document.getElementById(id);e.min=min;e.max=max;e.value=val}updateRanges(false)}
function currentVisibleSet(){let s=new Set();for(let n of S.nodes)if(visible(n))s.add(n.key());return s}
function updateRanges(animate=true){let z1=+zmin.value,z2=+zmax.value,n1=+nmin.value,n2=+nmax.value;if(z1>z2)[z1,z2]=[z2,z1];if(n1>n2)[n1,n2]=[n2,n1];let old=S.lastVisible.size?S.lastVisible:currentVisibleSet();S.aMinZ=z1;S.aMaxZ=z2;S.aMinN=n1;S.aMaxN=n2;rangeText.textContent=`Z ${z1}–${z2} · N ${n1}–${n2}`;if(S.sel&&!visible(S.sel))S.sel=null;if(S.freeze&&animate){settleVisible(170);let now=performance.now(),neu=currentVisibleSet();for(let k of old){if(!neu.has(k)){let n=S.by.get(k);if(n)S.fadeOut.set(k,{node:n,x:n.x,y:n.y,z:n.z,start:now})}}for(let k of neu){if(!old.has(k))S.fadeIn.set(k,now)}S.lastVisible=neu}}
function setSliderWindow(zlo,zhi,nlo,nhi,animate=true){zmin.value=Math.max(S.minZ,Math.min(S.maxZ,zlo));zmax.value=Math.max(S.minZ,Math.min(S.maxZ,zhi));nmin.value=Math.max(S.minN,Math.min(S.maxN,nlo));nmax.value=Math.max(S.minN,Math.min(S.maxN,nhi));updateRanges(animate)}
function startSweep(){if(!S.nodes.length)return;if(S.sweep){stopSweep();return}let zlo=Math.max(S.minZ,0),zhi=Math.min(S.maxZ,20),nlo=Math.max(S.minN,0),nhi=Math.min(S.maxN,20);S.freeze=true;S.fadeIn.clear();S.fadeOut.clear();setSliderWindow(zlo,zhi,nlo,nhi,false);settleVisible(260);let now=performance.now();S.lastVisible=currentVisibleSet();for(let k of S.lastVisible)S.fadeIn.set(k,now);sweepBtn.classList.add('running');sweepBtn.textContent='Stop animation';S.sweep={zlo,zhi,nlo,nhi,timer:null};setTimeout(()=>{if(!S.sweep)return;S.sweep.timer=setInterval(()=>{if(!S.sweep)return;S.sweep.zlo++;S.sweep.zhi++;S.sweep.nlo++;S.sweep.nhi++;setSliderWindow(S.sweep.zlo,S.sweep.zhi,S.sweep.nlo,S.sweep.nhi,true);if(S.sweep.zlo>=S.maxZ&&S.sweep.nlo>=S.maxN)stopSweep()},250)},900)}
function stopSweep(){if(S.sweep&&S.sweep.timer)clearInterval(S.sweep.timer);S.sweep=null;S.freeze=false;S.fadeOut.clear();S.lastVisible=currentVisibleSet();sweepBtn.classList.remove('running');sweepBtn.textContent='Animate sweep'}
function fadeInAlpha(n){if(!S.freeze)return 1;let t=S.fadeIn.get(n.key());if(t==null)return 1;return Math.max(0,Math.min(1,(performance.now()-t)/S.fadeMs))}
function fadeOutAlpha(k){let o=S.fadeOut.get(k);if(!o)return 0;let a=1-(performance.now()-o.start)/S.fadeMs;if(a<=0){S.fadeOut.delete(k);return 0}return Math.max(0,Math.min(1,a))}
function resetLayout(){S.nodes.forEach((n,i)=>{let ex=n.N-n.Z,r=120+n.Z*22+ex*10,a=Math.PI*2*n.Z/18+i*.05;n.x=Math.cos(a)*r;n.y=Math.sin(a)*r;n.z=ex*22;n.vx=n.vy=n.vz=0})}
function resetView(){S.zoom=.95;S.panX=S.panY=0;S.rx=-.35;S.ry=.55}
function visible(n){return n.Z>=S.aMinZ&&n.Z<=S.aMaxZ&&n.N>=S.aMinN&&n.N<=S.aMaxN}
function linkVisible(l){return visible(l.a)&&visible(l.b)&&(S.filter==='all'||l.type===S.filter)}
function halfLifeSeconds(n){if(n.stable)return Infinity;let h=Number(n.half);return isFinite(h)&&h>0?h:NaN}
function instability(n){if(n.stable)return 0;let h=halfLifeSeconds(n);if(!isFinite(h))return .55;return Math.max(0,Math.min(1,(20-Math.log10(h))/44))}
function stabilityLength(n,type){return type==='isotope'?58:58*(1+6*instability(n))}
function stabilityWidth(n,type){return type==='isotope'?(S.filter==='all'?1.2:2):1.4+3.8*instability(n)}
function stabilityAlpha(n,type){let base=S.filter==='all'?(type==='isotope'?.27:.55):.88;return Math.min(.98,base+.35*instability(n))}
function stabilityText(n){if(n.stable)return '1.00 unit / stable';let h=halfLifeSeconds(n),u=(1+6*instability(n)).toFixed(2);return isFinite(h)?u+' units / log10(t½ s) = '+Math.log10(h).toFixed(2):u+' units / half-life unknown'}
function forceStep(){let V=S.nodes.filter(visible),rep=V.length>1200?350:1500,sub=V.length>1200?V.filter((_,i)=>i%Math.ceil(V.length/1200)===0):V;for(let i=0;i<sub.length;i++)for(let j=i+1;j<sub.length;j++){let a=sub[i],b=sub[j],dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z,d2=dx*dx+dy*dy+dz*dz+.01,d=Math.sqrt(d2),f=rep/d2,fx=dx/d*f,fy=dy/d*f,fz=dz/d*f;a.vx-=fx;a.vy-=fy;a.vz-=fz;b.vx+=fx;b.vy+=fy;b.vz+=fz}for(let l of S.links){if(!linkVisible(l))continue;let T=stabilityLength(l.a,l.type),dx=l.b.x-l.a.x,dy=l.b.y-l.a.y,dz=l.b.z-l.a.z,d=Math.sqrt(dx*dx+dy*dy+dz*dz)+.01,f=(d-T)*.01,fx=dx/d*f,fy=dy/d*f,fz=dz/d*f;l.a.vx+=fx;l.a.vy+=fy;l.a.vz+=fz;l.b.vx-=fx;l.b.vy-=fy;l.b.vz-=fz}for(let n of V){n.vx+=-n.x*.00035;n.vy+=-n.y*.00035;n.vz+=-n.z*.00035;n.vx*=.84;n.vy*=.84;n.vz*=.84;n.x+=n.vx;n.y+=n.vy;n.z+=n.vz}}
function settleVisible(iter){for(let i=0;i<iter;i++)forceStep();for(let n of S.nodes){n.vx=n.vy=n.vz=0}}
function step(){if(S.drag||S.freeze)return;forceStep()}
function projectObj(o){let cy=Math.cos(S.ry),sy=Math.sin(S.ry),x1=o.x*cy+o.z*sy,z1=-o.x*sy+o.z*cy,cx=Math.cos(S.rx),sx=Math.sin(S.rx),y2=o.y*cx-z1*sx,z2=o.y*sx+z1*cx;return{x:c.clientWidth/2+S.panX+x1*S.zoom,y:c.clientHeight/2+S.panY+y2*S.zoom,depth:z2}}
function project(n){let p=projectObj(n);n.sx=p.x;n.sy=p.y;n.depth=p.depth}
function ds(d){return Math.max(.65,Math.min(1.35,1+d*.0008))}
function nodeColor(n){let h=(n.Z*137.508)%360;return `hsl(${h} 78% ${n.stable?58:32}%)`}
function lineRGB(t){return t==='isotope'?'120,160,255':t==='beta-'?'40,170,255':t==='beta+/ec'?'255,80,240':t==='alpha'?'255,145,30':'150,150,150'}
function rgba(rgb,a){return `rgba(${rgb},${a})`}
function exitProxy(k){let o=S.fadeOut.get(k);if(!o)return null;let p=projectObj(o);return{node:o.node,x:o.x,y:o.y,z:o.z,sx:p.x,sy:p.y,depth:p.depth,alpha:fadeOutAlpha(k)}}
function drawableFor(n){if(visible(n))return{node:n,x:n.x,y:n.y,z:n.z,sx:n.sx,sy:n.sy,depth:n.depth,alpha:fadeInAlpha(n)};return exitProxy(n.key())}
function draw(){resize();S.nodes.forEach(n=>{if(visible(n))project(n)});S.hover=closest(S.lastX,S.lastY);ctx.clearRect(0,0,c.clientWidth,c.clientHeight);let drawLinks=[];for(let l of S.links){if(S.filter!=='all'&&l.type!==S.filter)continue;let a=drawableFor(l.a),b=drawableFor(l.b);if(a&&b&&a.alpha>0&&b.alpha>0)drawLinks.push({l,a,b,alpha:Math.min(a.alpha,b.alpha)})}drawLinks.sort((x,y)=>(x.a.depth+x.b.depth)-(y.a.depth+y.b.depth));for(let d of drawLinks){let l=d.l;ctx.strokeStyle=rgba(lineRGB(l.type),stabilityAlpha(l.a,l.type)*d.alpha);ctx.lineWidth=stabilityWidth(l.a,l.type);ctx.beginPath();ctx.moveTo(d.a.sx,d.a.sy);ctx.lineTo(d.b.sx,d.b.sy);ctx.stroke();if(l.type!=='isotope')arrow(d)}let drawNodes=[];for(let n of S.nodes){if(visible(n)){drawNodes.push({node:n,sx:n.sx,sy:n.sy,depth:n.depth,alpha:fadeInAlpha(n)})}else{let ex=exitProxy(n.key());if(ex&&ex.alpha>0)drawNodes.push({node:ex.node,sx:ex.sx,sy:ex.sy,depth:ex.depth,alpha:ex.alpha})}}drawNodes.sort((a,b)=>a.depth-b.depth);for(let d of drawNodes){let n=d.node;if(d.alpha<=0)continue;let r=Math.max(3.5,Math.min(15,n.rad()*S.zoom*ds(d.depth)));ctx.globalAlpha=d.alpha;ctx.fillStyle=nodeColor(n);ctx.beginPath();ctx.arc(d.sx,d.sy,r,0,7);ctx.fill();ctx.globalAlpha=1;if(n===S.sel||n===S.hover){ctx.strokeStyle='white';ctx.lineWidth=2;ctx.beginPath();ctx.arc(d.sx,d.sy,r+5,0,7);ctx.stroke()}}if(S.labels)for(let d of drawNodes){let n=d.node;if(d.alpha<=0)continue;let act=n===S.sel||n===S.hover;ctx.globalAlpha=d.alpha;ctx.font=`${act?'700':'400'} ${act?15:10}px system-ui`;ctx.textAlign='center';ctx.fillStyle=act?'white':'rgba(215,215,215,.92)';ctx.fillText(n.label(),d.sx,d.sy-(act?21:15));ctx.globalAlpha=1}updateUI()}
function arrow(d){let l=d.l,dx=d.b.sx-d.a.sx,dy=d.b.sy-d.a.sy,len=Math.hypot(dx,dy);if(len<1)return;dx/=len;dy/=len;let s=instability(l.a),r=Math.max(3.5,Math.min(15,l.b.rad()*S.zoom*ds(d.b.depth))),tx=d.b.sx-dx*(r+3),ty=d.b.sy-dy*(r+3),bx=tx-dx*(12+8*s),by=ty-dy*(12+8*s),px=-dy,py=dx,w=6+4*s;ctx.fillStyle=rgba(lineRGB(l.type),stabilityAlpha(l.a,l.type)*d.alpha);ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(bx+px*w,by+py*w);ctx.lineTo(bx-px*w,by-py*w);ctx.closePath();ctx.fill()}
function closest(mx,my){let best=null,bd=18;for(let n of S.nodes){if(!visible(n))continue;let d=Math.hypot(mx-n.sx,my-n.sy);if(d<bd){bd=d;best=n}}return best}
function nodeStabilityLinks(a){return S.links.filter(l=>l.a===a&&l.type!=='isotope'&&linkVisible(l)).slice(0,6).map(l=>`<div class=mode><b>${esc(l.type)} → ${esc(l.b.label())}</b><span>${esc(stabilityText(l.a))}</span></div>`).join('')||'<div class=mode><b>No visible daughter decay links</b><span>—</span></div>'}
function updateUI(){let v=S.nodes.filter(visible).length,anim=S.sweep?' · Animation running: settled force-layout fade in/out':'';hud.innerHTML=`<b>Mode: ${S.mode.toUpperCase()}</b> · Visible: ${v.toLocaleString()} / ${S.nodes.length.toLocaleString()} nuclides · Links: ${S.links.length.toLocaleString()} · Filter: ${S.filter}${anim}<br>Z: ${S.aMinZ}–${S.aMaxZ} · N: ${S.aMinN}–${S.aMaxN} · Sweep pre-settles the force layout offscreen, then fades nodes and links at those positions.<br><span class=line style=background:#78a0ff></span>isotope <span class=line style=background:#28aaff></span>beta− <span class=line style=background:#ff50f0></span>beta+/EC <span class=line style=background:#ff9120></span>alpha`;let a=S.sel||S.hover;if(!a)return;let modes=a.modes.map(m=>`<div class=mode><b>${esc(m.mode)}</b><span>${esc(m.prob||'probability not listed')}</span></div>`).join('');info.innerHTML=`<div class=eyebrow style="color:${nodeColor(a)}">Element: ${esc(a.el).toUpperCase()}</div><h2>${esc(a.label())}</h2><div class=status>${a.stable?'Stable isotope':'Radioactive isotope'}</div><div class=detail><span>Element</span><span>${esc(a.el)}</span></div><div class=detail><span>Protons Z</span><span>${a.Z}</span></div><div class=detail><span>Neutrons N</span><span>${a.N}</span></div><div class=detail><span>Mass A</span><span>${a.A}</span></div><div class=detail><span>Half-life</span><span>${esc(a.stable?'Stable':formatHalf(a.half))}</span></div><div class=detail><span>Stability length</span><span>${esc(stabilityText(a))}</span></div><div class=detail><span>Primary decay</span><span>${esc(a.decay||'—')}</span></div><div class=eyebrow style="margin-top:12px">Decay modes</div>${modes}<div class=eyebrow style="margin-top:12px">Visible daughter link lengths</div>${nodeStabilityLinks(a)}`}
