<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nuclide Connection Web</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#020205;color:#f4f7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;background:radial-gradient(circle at 18% 10%,rgba(55,75,135,.28),transparent 32%),radial-gradient(circle at 80% 75%,rgba(95,20,110,.22),transparent 35%),#020205}#top,#bottom{position:fixed;left:0;right:0;z-index:2;background:rgba(2,2,5,.92);backdrop-filter:blur(8px);border-color:#1d2335;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}#top{top:0;border-bottom:1px solid #1d2335}#bottom{bottom:0;border-top:1px solid #1d2335}h1{font-size:18px;margin:0 12px 0 0}button,select{background:#111827;color:#f4f7ff;border:1px solid #334155;border-radius:10px;padding:7px 10px}button.active{border-color:#7dd3fc;box-shadow:0 0 0 1px #7dd3fc inset}label{font-size:12px;color:#a9b0c2}input[type=range]{width:210px}#hud,#info{position:fixed;z-index:1;background:rgba(9,10,16,.84);border:1px solid #20263a;border-radius:18px;box-shadow:0 18px 70px rgba(0,0,0,.4);padding:12px 14px;backdrop-filter:blur(10px)}#hud{top:72px;left:14px;max-width:720px;color:#a9b0c2;font-size:13px;pointer-events:none}#hud b{color:white}#info{top:72px;right:14px;width:360px;max-width:calc(100vw - 28px);max-height:calc(100vh - 150px);overflow:auto}#info h2{font-size:34px;margin:2px 0}.eyebrow{color:#7dd3fc;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.status{color:#a9b0c2;margin-bottom:10px}.detail{display:grid;grid-template-columns:115px 1fr;gap:10px;border-top:1px solid rgba(255,255,255,.08);padding:7px 0;font-size:14px}.detail span:first-child{color:#a9b0c2;font-size:12px}.line{display:inline-block;width:24px;height:3px;border-radius:99px;margin:0 4px;vertical-align:middle}.mode{display:flex;justify-cont Ge:'Germanium',As:'Arsenic',Se:'Selenium',Br:'Bromine',Kr:'Krypton',Rb:'Rubidium',Sr:'Strontium',Y:'Yttrium',Zr:'Zirconium',Nb:'Niobium',Mo:'Molybdenum',Tc:'Technetium',Ru:'Ruthenium',Rh:'Rhodium',Pd:'Palladium',Ag:'Silver',Cd:'Cadmium',In:'Indium',Sn:'Tin',Sb:'Antimony',Te:'Tellurium',I:'Iodine',Xe:'Xenon',Cs:'Cesium',Ba:'Barium',La:'Lanthanum',Ce:'Cerium',Pr:'Praseodymium',Nd:'Neodymium',Pm:'Promethium',Sm:'Samarium',Eu:'Europium',Gd:'Gadolinium',Tb:'Terbium',Dy:'Dysprosium',Ho:'Holmium',Er:'Erbium',Tm:'Thulium',Yb:'Ytterbium',Lu:'Lutetium',Hf:'Hafnium',Ta:'Tantalum',W:'Tungsten',Re:'Rhenium',Os:'Osmium',Ir:'Iridium',Pt:'Platinum',Au:'Gold',Hg:'Mercury',Tl:'Thallium',Pb:'Lead',Bi:'Bismuth',Po:'Polonium',At:'Astatine',Rn:'Radon',Fr:'Francium',Ra:'Radium',Ac:'Actinium',Th:'Thorium',Pa:'Protactinium',U:'Uranium',Np:'Neptunium',Pu:'Plutonium',Am:'Americium',Cm:'Curium',Bk:'Berkelium',Cf:'Californium',Es:'Einsteinium',Fm:'Fermium',Md:'Mendelevium',No:'Nobelium',Lr:'Lawrencium',Rf:'Rutherfordium',Db:'Dubnium',Sg:'Seaborgium',Bh:'Bohrium',Hs:'Hassium',Mt:'Meitnerium',Ds:'Darmstadtium',Rg:'Roentgenium',Cn:'Copernicium',Nh:'Nihonium',Fl:'Flerovium',Mc:'Moscovium',Lv:'Livermorium',Ts:'Tennessine',Og:'Oganesson'};const c=document.getElementById('c'),ctx=c.getContext('2d'),hud=document.getElementById('hud'),info=document.getElementById('info');let S={nodes:[],links:[],by:new Map(),mode:'move',filter:'all',labels:true,sel:null,hover:null,drag:null,zoom:.95,panX:0,panY:0,rx:-.35,ry:.55,down:false,orbiting:false,panning:false,lastX:0,lastY:0,minZ:0,maxZ:1,minN:0,maxN:1,aMinZ:0,aMaxZ:10,aMinN:0,aMaxN:10};function parseCSV(t){let rows=[],row=[],cell='',q=false;for(let i=0;i<t.length;i++){let ch=t[i],n=t[i+1];if(q){if(ch=='"'&&n=='"'){cell+='"';i++}else if(ch=='"')q=false;else cell+=ch}else{if(ch=='"')q=true;else if(ch==','){row.push(cell);cell=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&n=='\n')i++;row.push(cell);if(row.some(s=>s.trim()))rows.push(row);row=[];cell=''}else cell+=ch ,S.maxN)}function buildLinks(){S.links=[];let seen=new Set();for(let n of S.nodes){addLink(n,S.by.get(n.Z+','+(n.N+1)),'isotope',seen);let b=S.by.get((n.Z+1)+','+(n.N-1));if(b&&b.A===n.A)addLink(n,b,'beta-',seen);b=S.by.get((n.Z-1)+','+(n.N+1));if(b&&b.A===n.A)addLink(n,b,'beta+/ec',seen);b=S.by.get((n.Z-2)+','+(n.N-2));if(b&&n.A-b.A===4)addLink(n,b,'alpha',seen)}}function addLink(a,b,type,seen){if(!a||!b)return;let k=a.key()+'|'+b.key()+'|'+type,kk=b.key()+'|'+a.key()+'|'+type;if(seen.has(k)||seen.has(kk))return;seen.add(k);S.links.push({a,b,type})}function setupSliders(){for(let [id,min,max,val] of [['zmin',S.minZ,S.maxZ,S.aMinZ],['zmax',S.minZ,S.maxZ,S.aMaxZ],['nmin',S.minN,S.maxN,S.aMinN],['nmax',S.minN,S.maxN,S.aMaxN]]){let e=document.getElementById(id);e.min=min;e.max=max;e.value=val}updateRanges()}function updateRanges(){let z1=+zmin.value,z2=+zmax.value,n1=+nmin.value,n2=+nmax.value;if(z1>z2)[z1,z2]=[z2,z1];if(n1>n2)[n1,n2]=[n2,n1];S.aMinZ=z1;S.aMaxZ=z2;S.aMinN=n1;S.aMaxN=n2;rangeText.textContent=`Z ${z1}–${z2} · N ${n1}–${n2}`;if(S.sel&&!visible(S.sel))S.sel=null}function resetLayout(){S.nodes.forEach((n,i)=>{let ex=n.N-n.Z,r=120+n.Z*22+ex*10,a=Math.PI*2*n.Z/18+i*.05;n.x=Math.cos(a)*r;n.y=Math.sin(a)*r;n.z=ex*22;n.vx=n.vy=n.vz=0})}function resetView(){S.zoom=.95;S.panX=S.panY=0;S.rx=-.35;S.ry=.55}function visible(n){return n.Z>=S.aMinZ&&n.Z<=S.aMaxZ&&n.N>=S.aMinN&&n.N<=S.aMaxN}function linkVisible(l){return visible(l.a)&&visible(l.b)&&(S.filter==='all'||l.type===S.filter)}function step(){if(S.drag)return;let V=S.nodes.filter(visible),rep=V.length>1200?350:1500,sub=V.length>1200?V.filter((_,i)=>i%Math.ceil(V.length/1200)===0):V;for(let i=0;i<sub.length;i++)for(let j=i+1;j<sub.length;j++){let a=sub[i],b=sub[j],dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z,d2=dx*dx+dy*dy+dz*dz+.01,d=Math.sqrt(d2),f=rep/d2,fx=dx/d*f,fy=dy/d*f,fz=dz/d*f;a.vx-=fx;a.vy-=fy;a.vz-=fz;b.vx+=fx;b.vy+=fy;b.vz+=fz}for(let l of S.links){if(!linkVisible(l))continue;let T=l.type==='isotope'?58:l.type==='alpha'?125:90,dx=l.b.x-l.a.x,dy=l.b.y-l.a.y,dz=l.b.z-l.a.z,d=Math.sqrt(dx*dx+dy*dy+dz*dz)+.01,f=(d-T)*.01,fx=dx/d*f,fy=dy/d*f,fz=dz/d*f;l.a.vx+=fx;l.a.vy+=fy;l.a.vz+=fz;l.b.vx-=fx;l.b.vy-=fy;l.b.vz-=fz}for(let n of V){n.vx+=-n.x*.00035;n.vy+=-n.y*.00035;n.vz+=-n.z*.00035;n.vx*=.84;n.vy*=.84;n.vz*=.84;n.x+=n.vx;n.y+=n.vy;n.z+=n.vz}}function project(n){let cy=Math.cos(S.ry),sy=Math.sin(S.ry),x1=n.x*cy+n.z*sy,z1=-n.x*sy+n.z*cy,cx=Math.cos(S.rx),sx=Math.sin(S.rx),y2=n.y*cx-z1*sx,z2=n.y*sx+z1*cx;n.sx=c.clientWidth/2+S.panX+x1*S.zoom;n.sy=c.clientHeight/2+S.panY+y2*S.zoom;n.depth=z2}function ds(d){return Math.max(.65,Math.min(1.35,1+d*.0008))}function nodeColor(n){let h=(n.Z*137.508)%360;return `hsl(${h} 78% ${n.stable?58:32}%)`}function lineRGB(t){return t==='isotope'?'120,160,255':t==='beta-'?'40,170,255':t==='beta+/ec'?'255,80,240':t==='alpha'?'255,145,30':'150,150,150'}function draw(){resize();S.nodes.forEach(n=>{if(visible(n))project(n)});S.hover=closest(S.lastX,S.lastY);ctx.clearRect(0,0,c.clientWidth,c.clientHeight);let L=S.links.filter(linkVisible).sort((a,b)=>(a.a.depth+a.b.depth)-(b.a.depth+b.b.depth));for(let l of L){ctx.strokeStyle=`rgba(${lineRGB(l.type)},${S.filter==='all'?(l.type==='isotope'?.27:.65):.95})`;ctx.lineWidth=S.filter==='all'?1.35:2.35;ctx.beginPath();ctx.moveTo(l.a.sx,l.a.sy);ctx.lineTo(l.b.sx,l.b.sy);ctx.stroke();if(l.type!=='isotope')arrow(l)}let N=S.nodes.filter(visible).sort((a,b)=>a.depth-b.depth);for(let n of N){let r=Math.max(3.5,Math.min(15,n.rad()*S.zoom*ds(n.depth)));ctx.fillStyle=nodeColor(n);ctx.beginPath();ctx.arc(n.sx,n.sy,r,0,7);ctx.fill();if(n===S.sel||n===S.hover){ctx.strokeStyle='white';ctx.lineWidth=2;ctx.beginPath();ctx.arc(n.sx,n.sy,r+5,0,7);ctx.stroke()}}if(S.labels)for(let n of N){let act=n===S.sel||n===S.hover;ctx.font=`${act?'700':'400'} ${act?15:10}px system-ui`;ctx.textAlign='center';ctx.fillStyle=act?'white':'rgba(215,215,215,.92)';ctx.fillText(n.label(),n.sx,n.sy-(act?21:15))}updateUI()}function arrow(l){let dx=l.b.sx-l.a.sx,dy=l.b.sy-l.a.sy,len=Math.hypot(dx,dy);if(len<1)return;dx/=len;dy/=len;let r=Math.max(3.5,Math.min(15,l.b.rad()*S.zoom*ds(l.b.depth))),tx=l.b.sx-dx*(r+3),ty=l.b.sy-dy*(r+3),bx=tx-dx*14,by=ty-dy*14,px=-dy,py=dx;ctx.fillStyle=`rgba(${lineRGB(l.type)},${S.filter==='all'?.65:.95})`;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(bx+px*7,by+py*7);ctx.lineTo(bx-px*7,by-py*7);ctx.closePath();ctx.fill()}function closest(mx,my){let best=null,bd=18;for(let n of S.nodes){if(!visible(n))continue;let d=Math.hypot(mx-n.sx,my-n.sy);if(d<bd){bd=d;best=n}}return best}function updateUI(){let v=S.nodes.filter(visible).length;hud.innerHTML=`<b>Mode: ${S.mode.toUpperCase()}</b> · Visible: ${v.toLocaleString()} / ${S.nodes.length.toLocaleString()} nuclides · Links: ${S.links.length.toLocaleString()} · Filter: ${S.filter}<br>Z: ${S.aMinZ}–${S.aMaxZ} · N: ${S.aMinN}–${S.aMaxN} · rotX: ${S.rx.toFixed(2)} · rotY: ${S.ry.toFixed(2)}<br><span class=line style=background:#78a0ff></span>isotope <span class=line style=background:#28aaff></span>beta− <span class=line style=background:#ff50f0></span>beta+/EC <span class=line style=background:#ff9120></span>alpha`;let a=S.sel||S.hover;if(!a)return;let modes=a.modes.map(m=>`<div class=mode><b>${esc(m.mode)}</b><span>${esc(m.prob||'probability not listed')}</span></div>`).join('');info.innerHTML=`<div class=eyebrow style="color:${nodeColor(a)}">Element: ${esc(a.el).toUpperCase()}</div><h2>${esc(a.label())}</h2><div class=status>${a.stable?'Stable isotope':'Radioactive isotope'}</div><div class=detail><span>Element</span><span>${esc(a.el)}</span></div><div class=detail><span>Protons Z</span><span>${a.Z}</span></div><div class=detail><span>Neutrons N</span><span>${a.N}</span></div><div class=detail><span>Mass A</span><span>${a.A}</span></div><div class=detail><span>Half-life</span><span>${esc(a.stable?'Stable':formatHalf(a.half))}</span></div><div class=detail><span>Primary decay</span><span>${esc(a.decay||'—')}</span></div><div class=eyebrow style="margin-top:12px">Decay modes</div>${modes}`}function formatHalf(h){let s=+h;if(!isFinite(s))return h||'—';if(s<60)return s.toPrecision(4)+' s';if(s<3600)return(s/60).toPrecision(4)+' min';if(s<86400)return(s/3600).toPrecision(4)+' hr';if(s<31557600)return(s/86400).toPrecision(4)+' d';return(s/31557600).toPrecision(4)+' yr'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function resize(){let d=window.devicePixelRatio||1,w=Math.round(c.clientWidth*d),h=Math.round(c.clientHeight*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h;ctx.setTransform(d,0,0,d,0,0)}}function screenDeltaToWorld(dx,dy){let vx=dx/S.zoom,vy=dy/S.zoom,vz=0,cx=Math.cos(-S.rx),sx=Math.sin(-S.rx),y1=vy*cx-vz*sx,z1=vy*sx+vz*cx,cy=Math.cos(-S.ry),sy=Math.sin(-S.ry);return{x:vx*cy+z1*sy,y:y1,z:-vx*sy+z1*cy}}function setMode(m){S.mode=m;[move,orbit,pan].forEach(b=>b.classList.remove('active'));({move,orbit,pan}[m]).classList.add('active')}c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);S.down=true;S.lastX=e.clientX;S.lastY=e.clientY;if(e.button===2||S.mode==='pan'){S.panning=true;return}if(S.mode==='orbit'){S.orbiting=true;return}S.drag=closest(e.clientX,e.clientY);if(S.drag)S.sel=S.drag;else S.panning=true};c.onpointermove=e=>{let dx=e.clientX-S.lastX,dy=e.clientY-S.lastY;if(S.down){if(S.orbiting){S.ry+=dx*.01;S.rx=Math.max(-Math.PI/2,Math.min(Math.PI/2,S.rx+dy*.01))}else if(S.drag){let d=screenDeltaToWorld(dx,dy);S.drag.x+=d.x;S.drag.y+=d.y;S.drag.z+=d.z;S.drag.vx=S.drag.vy=S.drag.vz=0}else if(S.panning){S.panX+=dx;S.panY+=dy}}S.lastX=e.clientX;S.lastY=e.clientY};c.onpointerup=()=>{S.down=false;S.drag=null;S.panning=false;S.orbiting=false};c.oncontextmenu=e=>e.preventDefault();c.onwheel=e=>{e.preventDefault();let old=S.zoom,f=e.deltaY<0?1.1:.9;S.zoom=Math.max(.08,Math.min(8,S.zoom*f));let mx=e.clientX,my=e.clientY;S.panX=mx-c.clientWidth/2-(mx-c.clientWidth/2-S.panX)*(S.zoom/old);S.panY=my-c.clientHeight/2-(my-c.clientHeight/2-S.panY)*(S.zoom/old)};window.onkeydown=e=>{let k=e.key.toLowerCase();if(k==='m')setMode('move');else if(k==='o')setMode('orbit');else if(k==='p')setMode('pan');else if(k==='r')resetLayout();else if(k==='v')resetView();else if(k==='l'){S.labels=!S.labels;labels.checked=S.labels}else if('01234'.includes(k)){let vals=['all','isotope','beta-','beta+/ec','alpha'];S.filter=vals[+k];filter.value=S.filter}else if(k==='q'&&S.sel)S.sel.z-=24;else if(k==='e'&&S.sel)S.sel.z+=24};move.onclick=()=>setMode('move');orbit.onclick=()=>setMode('orbit');pan.onclick=()=>setMode('pan');resetL.onclick=resetLayout;resetV.onclick=resetView;labels.onchange=()=>S.labels=labels.checked;filter.onchange=()=>S.filter=filter.value;[zmin,zmax,nmin,nmax].forEach(e=>e.oninput=updateRanges);function loop(){step();draw();requestAnimationFrame(loop)}fetch(DATA_URL).then(r=>r.text()).then(load).catch(()=>load('Z,N,A,symbol,element,stable,decay,half_life\n1,0,1,H,Hydrogen,true,Stable,Stable\n1,1,2,H,Hydrogen,true,Stable,Stable\n1,2,3,H,Hydrogen,false,B-,388781328\n2,1,3,He,Helium,true,Stable,Stable\n2,2,4,He,Helium,true,Stable,Stable\n6,6,12,C,Carbon,true,Stable,Stable\n6,8,14,C,Carbon,false,B-,179874478055\n8,8,16,O,Oxygen,true,Stable,Stable'));loop();</script></body></html>
