<script>
const DATA_URL='https://raw.githubusercontent.com/posit-dev/great-tables/main/great_tables/data/16-nuclides.csv';
const UMEV=931.49410242,E_U=548.579909065,N_U=1008664.91595,H_U=1007825.031898,HE4_U=4002603.25413;
const c=document.getElementById('c'),ctx=c.getContext('2d'),mapCanvas=document.getElementById('miniMap'),mctx=mapCanvas.getContext('2d'),hud=document.getElementById('hud'),info=document.getElementById('info'),topBar=document.getElementById('top'),bottomBar=document.getElementById('bottom');
const FUSION_DATA=[['pp','p-p pathway','proton-proton',['H-1','H-1'],['H-2']],['pd','p-D pathway','proton-proton',['H-1','H-2'],['He-3']],['he3','He-3 branch','proton-proton',['He-3','He-3'],['He-4','H-1']],['dd1','D-D branch A','D-D',['H-2','H-2'],['He-3']],['dd2','D-D branch B','D-D',['H-2','H-2'],['H-3','H-1']],['dt','D-T branch','D-T',['H-2','H-3'],['He-4']],['dhe3','D-He3 branch','D-He3',['H-2','He-3'],['He-4','H-1']],['aa','alpha-alpha step','alpha capture',['He-4','He-4'],['Be-8']],['bea','Be-alpha step','alpha capture',['Be-8','He-4'],['C-12']],['ca','C-alpha step','alpha capture',['C-12','He-4'],['O-16']],['oa','O-alpha step','alpha capture',['O-16','He-4'],['Ne-20']],['nea','Ne-alpha step','alpha capture',['Ne-20','He-4'],['Mg-24']],['mga','Mg-alpha step','alpha capture',['Mg-24','He-4'],['Si-28']]];
let S={nodes:[],links:[],reactions:[],by:new Map(),mode:'orbit',heightMode:'stability',maxDecayEnergy:1,labels:true,showDots:true,showLines:true,showArrows:true,showFloor:true,showColumns:true,naturalOnly:false,fusionMode:'nodes',linkTypes:{isotope:false,'beta-':true,'beta+/ec':true,alpha:true,proton:true,neutron:true,delayed:false,fusion:false},sel:null,selReaction:null,hover:null,hoverReaction:null,zoom:.86,panX:0,panY:20,rx:-.72,ry:.78,down:false,orbiting:false,panning:false,pinch:false,pinchDist:0,pinchZoom:.86,lastX:0,lastY:0,clickX:0,clickY:0,clickT:0,autoOrbit:false,autoPivot:null,autoScreen:null,minZ:0,maxZ:1,minN:0,maxN:1,aMinZ:1,aMaxZ:10,aMinN:0,aMaxN:10,zScale:90,nScale:90,yScale:270,mapDrag:null,mapPad:12};
function setPanelVars(){document.documentElement.style.setProperty('--topH',Math.ceil(topBar.getBoundingClientRect().height)+'px');document.documentElement.style.setProperty('--bottomH',Math.ceil(bottomBar.getBoundingClientRect().height)+'px')}addEventListener('resize',()=>{setPanelVars();resizeMiniMap()});new ResizeObserver(()=>{setPanelVars();resizeMiniMap()}).observe(topBar);new ResizeObserver(()=>{setPanelVars();resizeMiniMap()}).observe(bottomBar);setTimeout(()=>{setPanelVars();resizeMiniMap()},0);
function parseCSV(t){let rows=[],row=[],cell='',q=false;for(let i=0;i<t.length;i++){let ch=t[i],n=t[i+1];if(q){if(ch==='"'&&n==='"'){cell+='"';i++}else if(ch==='"')q=false;else cell+=ch}else{if(ch==='"')q=true;else if(ch===','){row.push(cell);cell=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&n==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell=''}else cell+=ch}}row.push(cell);if(row.some(v=>v.trim()))rows.push(row);let h=rows.shift().map(v=>v.trim());return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()]))) }
function pct(v){if(v==null||String(v).trim()==='')return '';let n=Number(v);if(!isFinite(n))return String(v);return n<=1?(n*100).toPrecision(4)+'%':n.toPrecision(4)+'%'}
function rowModes(r,stable){if(stable)return[{mode:'Stable',prob:'100%'}];let out=[];for(let i=1;i<=3;i++){let d=(r['decay_'+i]||'').trim();if(d)out.push({mode:d,prob:pct(r['decay_'+i+'_pct'])})}let d=(r.decay||r.decay_1||'').trim();if(!out.length&&d)out.push({mode:d,prob:pct(r.decay_pct||'')});return out.length?out:[{mode:'Unknown / not listed',prob:''}]}
function naturalFlagFromRow(r){for(let k of ['natural','naturally_occurring','is_natural','abundance','natural_abundance']){if(r[k]!=null&&String(r[k]).trim()!==''){let s=String(r[k]).toLowerCase(),n=Number(r[k]);if(['true','yes','y'].includes(s))return true;if(['false','no','n','synthetic'].includes(s))return false;if(isFinite(n)&&n>0)return true}}return null}
function microMass(v){let n=Number(v);return isFinite(n)?(n<1000?n*1e6:n):NaN}
function load(text){let rows=parseCSV(text),seen=new Set();S.nodes=[];S.by=new Map();for(let r of rows){let Z=+r.z,N=+r.n,A=Z+N,sym=r.element,el=sym,stableText=r.is_stable,decay=r.decay_1||'',half=r.half_life||'',mass=microMass(r.atomic_mass);if(!isFinite(Z)){Z=+r.Z;N=+r.N;A=+r.A||Z+N;sym=r.symbol;el=r.element||sym;stableText=r.stable;decay=r.decay||'';half=r.half_life||'';mass=microMass(r.atomic_mass||r.mass)}if(!sym||!isFinite(Z)||!isFinite(N)||Z<0||N<0)continue;let key=Z+','+N;if(seen.has(key))continue;seen.add(key);let stable=/true|yes|stable/i.test(stableText)||/^stable$/i.test(decay);if(stable){decay='Stable';half='Stable'}let node={Z,N,A,sym,el,stable,decay,half,mass,modes:rowModes(r,stable),naturalFlag:naturalFlagFromRow(r),x:0,y:0,z:0,sx:0,sy:0,depth:0,label(){return this.sym+'-'+this.A},rad(){return this.stable?8:6},key(){return this.Z+','+this.N}};node.isNatural=node.naturalFlag!==null?!!node.naturalFlag:node.stable;S.nodes.push(node);S.by.set(key,node);S.by.set(node.label(),node)}setBounds();buildLinks();buildFusion();setupControls();layoutAll();resetView();setPanelVars();resizeMiniMap()}
function setBounds(){S.minZ=Math.min(...S.nodes.map(n=>n.Z));S.maxZ=Math.max(...S.nodes.map(n=>n.Z));S.minN=Math.min(...S.nodes.map(n=>n.N));S.maxN=Math.max(...S.nodes.map(n=>n.N));S.aMinZ=Math.max(1,S.minZ);S.aMaxZ=Math.min(10,S.maxZ);S.aMinN=Math.max(0,S.minN);S.aMaxN=Math.min(10,S.maxN)}
function cleanMode(m){return String(m||'').toLowerCase().replace(/β/g,'b').replace(/\s+/g,'')}function addDecayTarget(n,Z,N,type,seen){add(n,S.by.get(Z+','+N),type,seen)}
function buildLinks(){S.links=[];let seen=new Set();for(let n of S.nodes){add(n,S.by.get(n.Z+','+(n.N+1)),'isotope',seen);if(n.stable)continue;for(let mode of n.modes){let d=cleanMode(mode.mode);if(!d||d==='stable')continue;if(d.includes('b-')||d.includes('beta-'))addDecayTarget(n,n.Z+1,n.N-1,'beta-',seen);if(d.includes('ec')||d.includes('b+')||d.includes('beta+'))addDecayTarget(n,n.Z-1,n.N+1,'beta+/ec',seen);if(d==='a'||d==='alpha')addDecayTarget(n,n.Z-2,n.N-2,'alpha',seen);if(d==='p')addDecayTarget(n,n.Z-1,n.N,'proton',seen);if(d==='2p')addDecayTarget(n,n.Z-2,n.N,'proton',seen);if(d==='n')addDecayTarget(n,n.Z,n.N-1,'neutron',seen);if(d==='2n')addDecayTarget(n,n.Z,n.N-2,'neutron',seen);if(d.includes('b+p'))addDecayTarget(n,n.Z-2,n.N+1,'delayed',seen);if(d.includes('b+a'))addDecayTarget(n,n.Z-3,n.N-1,'delayed',seen);if(d.includes('b-2n'))addDecayTarget(n,n.Z+1,n.N-3,'delayed',seen);else if(d.includes('b-n'))addDecayTarget(n,n.Z+1,n.N-2,'delayed',seen);if(d.includes('b-a'))addDecayTarget(n,n.Z-1,n.N-3,'delayed',seen);if(d.includes('b-p'))addDecayTarget(n,n.Z,n.N-1,'delayed',seen)}}}
function add(a,b,type,seen){if(!a||!b)return;let k=a.key()+'|'+b.key()+'|'+type,kr=b.key()+'|'+a.key()+'|'+type;if(seen.has(k)||seen.has(kr))return;seen.add(k);S.links.push({a,b,type})}
function buildFusion(){S.reactions=[];for(let f of FUSION_DATA){let [id,label,category,rin,pout]=f,reactants=rin.map(x=>S.by.get(x)).filter(Boolean),products=pout.map(x=>S.by.get(x)).filter(Boolean);if(reactants.length===rin.length&&products.length)S.reactions.push({id,label,category,reactants,products,x:0,y:0,z:0,sx:0,sy:0,depth:0})}}
function setupControls(){zScale.value=S.zScale;nScale.value=S.nScale;yScale.value=S.yScale;heightMode.value=S.heightMode;syncScaleLabels();for(let t of Object.keys(S.linkTypes))setLinkType(t,S.linkTypes[t]);updateRanges(S.aMinZ,S.aMaxZ,S.aMinN,S.aMaxN)}
function syncScaleLabels(){zScaleText.textContent=S.zScale;nScaleText.textContent=S.nScale;yScaleText.textContent=S.yScale}function setAxisScale(axis,val){S[axis]=+val;syncScaleLabels();layoutAll();setPanelVars()}
function halfLifeSeconds(n){if(n.stable)return Infinity;let h=Number(n.half);return isFinite(h)&&h>0?h:NaN}function instability(n){if(n.stable)return 0;let h=halfLifeSeconds(n);if(!isFinite(h))return .55;let log=Math.log10(1+h);return 1-Math.max(0,Math.min(1,log/20))}
function qValsForMode(n,mode){let d=cleanMode(mode),vals=[];function add(Z,N,extra=0){let q=qFrom(n,Z,N,extra);if(q!==null&&isFinite(q)&&q>0)vals.push(q)}if(!d||d==='stable')return vals;if(d.includes('b+p'))add(n.Z-2,n.N+1,H_U+2*E_U);else if(d.includes('b+a'))add(n.Z-3,n.N-1,HE4_U+2*E_U);else if(d.includes('b-2n'))add(n.Z+1,n.N-3,2*N_U);else if(d.includes('b-n'))add(n.Z+1,n.N-2,N_U);else if(d.includes('b-a'))add(n.Z-1,n.N-3,HE4_U);else if(d.includes('b-p'))add(n.Z,n.N-1,H_U);else if(d==='2p')add(n.Z-2,n.N,2*H_U);else if(d==='p')add(n.Z-1,n.N,H_U);else if(d==='2n')add(n.Z,n.N-2,2*N_U);else if(d==='n')add(n.Z,n.N-1,N_U);else if(d==='a'||d==='alpha')add(n.Z-2,n.N-2,HE4_U);else{if(d.includes('ec'))add(n.Z-1,n.N+1,0);if(d.includes('b+')||d.includes('beta+'))add(n.Z-1,n.N+1,2*E_U);if(d.includes('b-')||d.includes('beta-'))add(n.Z+1,n.N-1,0)}return vals}
function modeDecayEnergy(n,mode){let vals=qValsForMode(n,mode);return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:NaN}
function branchWeights(n){let modes=(n.modes&&n.modes.length?n.modes:[]),items=modes.map(m=>({mode:m.mode,prob:pctNumber(m.prob)})),known=items.filter(x=>isFinite(x.prob)&&x.prob>0).reduce((s,x)=>s+x.prob,0);if(known>0){items.forEach(x=>{if(!isFinite(x.prob)||x.prob<=0)x.prob=Math.max(0,(1-known)/(items.length-1||1))})}else items.forEach(x=>x.prob=items.length?1/items.length:0);let total=items.reduce((s,x)=>s+x.prob,0)||1;items.forEach(x=>x.prob=x.prob/total);return items}
function weightedDecayEnergy(n){if(!n||n.stable)return 0;let sum=0,weight=0;for(let item of branchWeights(n)){let e=modeDecayEnergy(n,item.mode);if(isFinite(e)){sum+=e*item.prob;weight+=item.prob}}return weight>0?sum/weight:0}
function recalcMaxDecayEnergy(){let max=0;for(let n of S.nodes)max=Math.max(max,weightedDecayEnergy(n));S.maxDecayEnergy=max||1}
function heightValue(n){return S.heightMode==='decayEnergy'?Math.max(0,Math.min(1,weightedDecayEnergy(n)/(S.maxDecayEnergy||1))):instability(n)}
function layoutAll(){if(S.heightMode==='decayEnergy')recalcMaxDecayEnergy();let cz=(S.aMinZ+S.aMaxZ)/2,cn=(S.aMinN+S.aMaxN)/2;for(let n of S.nodes){n.x=(n.Z-cz)*S.zScale;n.z=(n.N-cn)*S.nScale;n.y=-heightValue(n)*S.yScale}for(let r of S.reactions){let all=[...r.reactants,...r.products];r.x=avg(all,'x');r.z=avg(all,'z');r.y=avg(all,'y')-42-(r.category==='alpha capture'?24:0)}}function avg(a,k){return a.reduce((s,o)=>s+o[k],0)/Math.max(1,a.length)}
function visible(n){return n.Z>=S.aMinZ&&n.Z<=S.aMaxZ&&n.N>=S.aMinN&&n.N<=S.aMaxN&&(!S.naturalOnly||n.isNatural)}function reactionVisible(r){return S.linkTypes.fusion&&r.reactants.some(visible)&&r.products.some(visible)}
function updateRanges(z1=S.aMinZ,z2=S.aMaxZ,n1=S.aMinN,n2=S.aMaxN){z1=Math.round(Math.max(S.minZ,Math.min(S.maxZ,z1)));z2=Math.round(Math.max(S.minZ,Math.min(S.maxZ,z2)));n1=Math.round(Math.max(S.minN,Math.min(S.maxN,n1)));n2=Math.round(Math.max(S.minN,Math.min(S.maxN,n2)));if(z1>z2)[z1,z2]=[z2,z1];if(n1>n2)[n1,n2]=[n2,n1];S.aMinZ=z1;S.aMaxZ=z2;S.aMinN=n1;S.aMaxN=n2;rangeText.textContent=`Z ${z1}–${z2} · N ${n1}–${n2}`;layoutAll();setPanelVars()}function resetView(){stopAutoOrbit();S.zoom=.86;S.panX=0;S.panY=20;S.rx=-.72;S.ry=.78}function linkVisible(l){return visible(l.a)&&visible(l.b)&&S.linkTypes[l.type]}
