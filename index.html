<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=8,user-scalable=yes"><title>H.A.N.K. - Handy Atomic Nuclide Kindathingy</title><style>:root{--topH:86px;--bottomH:54px}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#020205;color:#f4f7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;background:radial-gradient(circle at 20% 10%,rgba(55,75,135,.25),transparent 32%),radial-gradient(circle at 80% 75%,rgba(95,20,110,.2),transparent 35%),#020205}#top,#bottom{position:fixed;left:0;right:0;z-index:4;background:rgba(2,2,5,.94);backdrop-filter:blur(8px);border-color:#1d2335;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;overflow:auto}#top{top:0;border-bottom:1px solid #1d2335;max-height:36vh}#bottom{bottom:0;border-top:1px solid #1d2335;max-height:24vh}h1{font-size:17px;margin:0 10px 0 0;white-space:nowrap}button,select{background:#111827;color:#f4f7ff;border:1px solid #334155;border-radius:10px;padding:7px 10px;cursor:pointer}button.active{border-color:#7dd3fc;box-shadow:0 0 0 1px rgba(125,211,252,.35) inset}label{font-size:12px;color:#a9b0c2;white-space:nowrap}.group{display:flex;gap:6px;align-items:center;flex-wrap:wrap;border:1px solid #263044;border-radius:12px;padding:5px 8px;background:rgba(15,23,42,.55)}.group-title{font-size:11px;color:#dbeafe;font-weight:700}.tinyrange{width:88px}.value{color:#dbeafe;font-size:12px;min-width:26px;display:inline-block}.line{display:inline-block;width:24px;height:3px;border-radius:99px;margin:0 4px;vertical-align:middle}#hud,#info{position:fixed;z-index:3;background:rgba(9,10,16,.86);border:1px solid #20263a;border-radius:18px;padding:12px 14px;backdrop-filter:blur(10px)}#hud{top:calc(var(--topH) + 12px);left:14px;max-width:min(1050px,calc(100vw - 28px));color:#a9b0c2;font-size:13px;pointer-events:none}#hud b Plus" type="checkbox" checked> Beta+/EC</label><label><input id="linkAlpha" type="checkbox" checked> Alpha</label><label><input id="linkFusion" type="checkbox" checked> Fusion</label></span><label>Fusion display <select id="fusionMode"><option value="nodes" selected>Reaction nodes</option><option value="grouped">Grouped</option><option value="simple">Simple</option></select></label><label><input id="naturalOnly" type="checkbox"> Natural only</label><label><input id="lineToggle" type="checkbox" checked> Lines</label><label><input id="arrows" type="checkbox" checked> Arrows</label><label><input id="dots" type="checkbox" checked> Dots</label><label><input id="labels" type="checkbox" checked> Labels</label></div><div id="hud"></div><div id="info"><div class="eyebrow">Selection</div><h2>None</h2><div class="status">Click a nuclide node or a fusion junction.</div><div class="detail"><span>Tip</span><span>Fusion reactions now have their own diamond-shaped junction nodes. Reactants flow in; products flow out.</span></div></div><div id="bottom"><label>Z min <input id="zmin" type="range"></label><label>Z max <input id="zmax" type="range"></label><label>N min <input id="nmin" type="range"></label><label>N max <input id="nmax" type="range"></label><span id="rangeText" style="color:#a9b0c2;font-size:13px"></span></div><script>const DATA_URL='https://raw.githubusercontent.com/posit-dev/great-tables/main/great_tables/data/16-nuclides.csv',c=document.getElementById('c'),ctx=c.getContext('2d'),hud=document.getElementById('hud'),info=document.getElementById('info');const FUSION_DATA=[['pp','p-p pathway','proton-proton',['H-1','H-1'],['H-2']],['pd','p-D pathway','proton-proton',['H-1','H-2'],['He-3']],['he3','He-3 branch','proton-proton',['He-3','He-3'],['He-4','H-1']],['dd1','D-D branch A','D-D',['H-2','H-2'],['He-3']],['dd2','D-D branch B','D-D',['H-2','H-2'],['H-3','H-1']],['dt','D-T branch','D-T',['H-2','H-3'],['He-4']],['dhe3','D-He3 branch','D-He3',['H-2','He-3'],['He-4','H-1']],['aa','alpha-alpha step','alpha capture',['He-4','He-4'],['Be-8']],['bea','Be-alpha step','alpha capture',['Be-8','He-4'],['C-12']],['ca','C-alpha step','alpha capture',['C-12','He-4'],['O-16']],['oa','O-alpha step','alpha capture',['O-16','He-4'],['Ne-20']],['nea','Ne-alpha step','alpha capture',['Ne-20','He-4'],['Mg-24']],['mga','Mg-alpha step','alpha capture',['Mg-24','He-4'],['Si-28']]];let S={nodes:[],links:[],reactions:[],by:new Map(),mode:'move',labels:true,showDots:true,showLines:true,showArrows:true,naturalOnly:false,fusionMode:'nodes',linkTypes:{isotope:true,'beta-':true,'beta+/ec':true,alpha:true,fusion:true},sel:null,selReaction:null,hover:null,hoverReaction:null,zoom:.85,panX:0,panY:20,rx:-.72,ry:.78,down:false,orbiting:false,panning:false,pinch:false,pinchDist:0,pinchZoom:.85,lastX:0,lastY:0,minZ:0,maxZ:1,minN:0,maxN:1,aMinZ:0,aMaxZ:10,aMinN:0,aMaxN:10,zScale:42,nScale:32,yScale:360};function setPanelVars(){document.documentElement.style.setProperty('--topH',top.offsetHeight+'px');document.documentElement.style.setProperty('--bottomH',bottom.offsetHeight+'px')}addEventListener('resize',setPanelVars);setTimeout(setPanelVars,0);function parseCSV(t){let rows=[],row=[],cell='',q=false;for(let i=0;i<t.length;i++){let ch=t[i],n=t[i+1];if(q){if(ch=='"'&&n=='"'){cell+='"';i++}else if(ch=='"')q=false;else cell+=ch}else{if(ch=='"')q=true;else if(ch==','){row.push(cell);cell=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&n=='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell=''}else cell+=ch}}row.push(cell);if(row.some(v=>v.trim()))rows.push(row);let h=rows.shift().map(v=>v.trim());return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()]))) }function num(v){let n=Number(v);return isFinite(n)?n:NaN}function pct(v){if(v==null||String(v).trim()==='')return '';let n=Number(v);if(!isFinite(n))return String(v);return n<=1?(n*100).toPrecision(4)+'%':n.toPrecision(4)+'%'}function rowModes(r,stable){if(stable)return[{mode:'Stable',prob:'100%'}];let out=[];for(let i=1;i<=3;i++){let d=(r['decay_'+i]||'').trim();if(d)out.push({mode:d,prob:pct(r['decay_'+i+'_pct'])})}let d=(r.decay||r.decay_1||'').trim();if(!out.length&&d)out.push({mode:d,prob:pct(r.decay_pct||'')});return out.length?out:[{mode:'Unknown / not listed',prob:''}]}function naturalFlagFromRow(r){for(let k of ['natural','naturally_occurring','is_natural','abundance','natural_abundance']){if(r[k]!=null&&String(r[k]).trim()!==''){let s=String(r[k]).toLowerCase(),n=Number(r[k]);if(['true','yes','y'].includes(s))return true;if(['false','no','n','synthetic'].includes(s))return false;if(isFinite(n)&&n>0)return true}}return null}function load(text){let rows=parseCSV(text),seen=new Set();S.nodes=[];S.by=new Map();for(let r of rows){let Z=+r.z,N=+r.n,A=Z+N,sym=r.element,el=sym,stableText=r.is_stable,decay=r.decay_1||'',half=r.half_life||'';if(!isFinite(Z)){Z=+r.Z;N=+r.N;A=+r.A||Z+N;sym=r.symbol;el=r.element||sym;stableText=r.stable;decay=r.decay||'';half=r.half_life||''}if(!sym||!isFinite(Z)||!isFinite(N)||Z<0||N<0)continue;let key=Z+','+N;if(seen.has(key))continue;seen.add(key);let stable=/true|yes|stable/i.test(stableText)||/^stable$/i.test(decay);if(stable){decay='Stable';half='Stable'}let node={Z,N,A,sym,el,stable,decay,half,modes:rowModes(r,stable),naturalFlag:naturalFlagFromRow(r),x:0,y:0,z:0,sx:0,sy:0,depth:0,label(){return this.sym+'-'+this.A},rad(){return this.stable?8:6},key(){return this.Z+','+this.N}};node.isNatural=node.naturalFlag!==null?!!node.naturalFlag:node.stable;S.nodes.push(node);S.by.set(key,node);S.by.set(node.label(),node)}setBounds();buildLinks();buildFusion();setupSliders();layoutAll();resetView();setPanelVars()}function setBounds(){S.minZ=Math.min(...S.nodes.map(n=>n.Z));S.maxZ=Math.max(...S.nodes.map(n=>n.Z));S.minN=Math.min(...S.nodes.map(n=>n.N));S.maxN=Math.max(...S.nodes.map(n=>n.N));S.aMinZ=S.minZ;S.aMaxZ=Math.min(10,S.maxZ);S.aMinN=S.minN;S.aMaxN=Math.min(10,S.maxN)}function modeText(n){return(n.modes||[]).map(x=>String(x.mode||'').toLowerCase()).join(' ')}function hasMode(n,t){if(n.stable)return false;let m=modeText(n);if(t==='beta-')return /b-|beta-|β-/.test(m);if(t==='beta+/ec')return /b\+|beta\+|β\+|ec|electron/.test(m);if(t==='alpha')return /(^|\W)(a|alpha|α)(\W|$)/.test(m);return true}function buildLinks(){S.links=[];let seen=new Set();for(let n of S.nodes){add(n,S.by.get(n.Z+','+(n.N+1)),'isotope',seen);if(n.stable)continue;let b=S.by.get((n.Z+1)+','+(n.N-1));if(b&&b.A===n.A&&hasMode(n,'beta-'))add(n,b,'beta-',seen);b=S.by.get((n.Z-1)+','+(n.N+1));if(b&&b.A===n.A&&hasMode(n,'beta+/ec'))add(n,b,'beta+/ec',seen);b=S.by.get((n.Z-2)+','+(n.N-2));if(b&&n.A-b.A===4&&hasMode(n,'alpha'))add(n,b,'alpha',seen)}}function add(a,b,type,seen){if(!a||!b)return;let k=a.key()+'|'+b.key()+'|'+type,kr=b.key()+'|'+a.key()+'|'+type;if(seen.has(k)||seen.has(kr))return;seen.add(k);S.links.push({a,b,type})}function buildFusion(){S.reactions=[];for(let f of FUSION_DATA){let [id,label,category,rin,pout]=f,reactants=rin.map(x=>S.by.get(x)).filter(Boolean),products=pout.map(x=>S.by.get(x)).filter(Boolean);if(reactants.length===rin.length&&products.length)S.reactions.push({id,label,category,reactants,products,x:0,y:0,z:0,sx:0,sy:0,depth:0})}}function setupSliders(){for(let [id,min,max,val] of [['zmin',S.minZ,S.maxZ,S.aMinZ],['zmax',S.minZ,S.maxZ,S.aMaxZ],['nmin',S.minN,S.maxN,S.aMinN],['nmax',S.minN,S.maxN,S.aMaxN]]){let e=document.getElementById(id);e.min=min;e.max=max;e.value=val}zScale.value=S.zScale;nScale.value=S.nScale;yScale.value=S.yScale;syncScaleLabels();updateRanges()}function syncScaleLabels(){zScaleText.textContent=S.zScale;nScaleText.textContent=S.nScale;yScaleText.textContent=S.yScale}function setAxisScale(axis,val){S[axis]=+val;syncScaleLabels();layoutAll()}function halfLifeSeconds(n){if(n.stable)return Infinity;let h=Number(n.half);return isFinite(h)&&h>0?h:NaN}function instability(n){if(n.stable)return 0;let h=halfLifeSeconds(n);if(!isFinite(h))return .55;let log=Math.log10(1+h);return 1-Math.max(0,Math.min(1,log/20))}function layoutAll(){let cz=(S.aMinZ+S.aMaxZ)/2,cn=(S.aMinN+S.aMaxN)/2;for(let n of S.nodes){n.x=(n.Z-cz)*S.zScale;n.z=(n.N-cn)*S.nScale;n.y=-instability(n)*S.yScale}for(let r of S.reactions){let all=[...r.reactants,...r.products];r.x=avg(all,'x');r.z=avg(all,'z');r.y=avg(all,'y')-42-(r.category==='alpha capture'?24:0)}}function avg(a,k){return a.reduce((s,o)=>s+o[k],0)/Math.max(1,a.length)}function visible(n){return n.Z>=S.aMinZ&&n.Z<=S.aMaxZ&&n.N>=S.aMinN&&n.N<=S.aMaxN&&(!S.naturalOnly||n.isNatural)}function reactionVisible(r){return S.linkTypes.fusion&&r.reactants.some(visible)&&r.products.some(visible)}function updateRanges(){let z1=+zmin.value,z2=+zmax.value,n1=+nmin.value,n2=+nmax.value;if(z1>z2)[z1,z2]=[z2,z1];if(n1>n2)[n1,n2]=[n2,n1];S.aMinZ=z1;S.aMaxZ=z2;S.aMinN=n1;S.aMaxN=n2;rangeText.textContent=`Z ${z1}–${z2} · N ${n1}–${n2}`;layoutAll();setPanelVars()}function resetView(){S.zoom=.85;S.panX=0;S.panY=20;S.rx=-.72;S.ry=.78}function linkVisible(l){return visible(l.a)&&visible(l.b)&&S.linkTypes[l.type]}function projectObj(o){let cy=Math.cos(S.ry),sy=Math.sin(S.ry),x1=o.x*cy+o.z*sy,z1=-o.x*sy+o.z*cy,cx=Math.cos(S.rx),sx=Math.sin(S.rx),y2=o.y*cx-z1*sx,z2=o.y*sx+z1*cx;return{x:c.clientWidth/2+S.panX+x1*S.zoom,y:c.clientHeight/2+S.panY+y2*S.zoom,depth:z2}}function screenCenterWorld(){let vx=-S.panX/S.zoom,vy=-S.panY/S.zoom,cx=Math.cos(-S.rx),sx=Math.sin(-S.rx),cy=Math.cos(-S.ry),sy=Math.sin(-S.ry),y1=vy*cx,z1=vy*sx;return{x:vx*cy+z1*sy,y:y1,z:-vx*sy+z1*cy}}function keepWorldAtScreenCenter(p){let s=projectObj(p);S.panX+=c.clientWidth/2-s.x;S.panY+=c.clientHeight/2-s.y}function project(n){let p=projectObj(n);n.sx=p.x;n.sy=p.y;n.depth=p.depth}function ds(d){return Math.max(.65,Math.min(1.35,1+d*.0008))}function nodeColor(n){let h=(n.Z*137.508)%360;return`hsl(${h} 78% ${n.stable?58:34}%)`}function fusionRGB(cat){return cat==='D-T'?'255,215,80':cat==='D-D'?'140,115,255':cat==='D-He3'?'255,145,55':cat==='alpha capture'?'255,85,
