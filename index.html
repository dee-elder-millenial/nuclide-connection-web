<style>

1px solid rgba(255,255,255,.08);padding:7px 0;font-size:14px}.line{display:inline-block;width:24px;height:3px;border-radius:99px;margin:0 4px;vertical-align:middle}@media(max-width:850px){#info{top:auto;bottom:116px;left:14px;right:14px;width:auto;max-height:230px}#bottom{display:grid;grid-template-columns:1fr}}
</style>

<body>
<canvas id="c"></canvas>
<div id="top"><h1>Nuclide Connection Web</h1><button id="move" class="active">Move</button><button id="orbit">Orbit</button><button id="pan">Pan</button><button id="resetL">Reset layout</button><button id="resetV">Reset view</button><button id="sweepBtn">Animate sweep</button><label>Sweep size <input id="sweepSize" class="smallrange" type="range" min="4" max="40" value="12"></label><span id="sweepSizeText" class="value">12</span><span class="group"><span class="group-title">Axis scale</span><label>Z <input id="zScale" class="tinyrange" type="range" min="18" max="90" value="42"></label><span id="zScaleText" class="value">42</span><label>N <input id="nScale" class="tinyrange" type="range" min="12" max="80" value="32"></label><span id="nScaleText" class="value">32</span><label>Stability <input id="yScale" class="tinyrange" type="range" min="80" max="700" value="360"></label><span id="yScaleText" class="value">360</span></span><span class="group"><span class="group-title">Link types</span><label><input id="linkIsotope" type="checkbox" checked> Isotope</label><label><input id="linkBetaMinus" type="checkbox" checked> Beta−</label><label><input id="linkBetaPlus" type="checkbox" checked> Beta+/EC</label><label><input id="linkAlpha" type="checkbox" checked> Alpha</label></span><label><input id="lineToggle" type="checkbox" checked> Lines</label><label><input id="arrows" type="checkbox" checked> Arrows</label><label><input id="dots" type="checkbox" checked> Dots</label><label><input id="labels" type="checkbox" checked> Labels</label></div>
<div id="hud"></div>
<div id="info"><div class="eyebrow">Selection</div><h2>None</h2><div class="status">Click a nuclide node.</div><div class="detail"><span>Tip</span><span>Decay-line thickness now represents decay energy. If no energy is listed in the CSV, the app uses a mode-based estimate.</span></div></div>
<div id="bottom"><label>Z min <input id="zmin" type="range"></label><label>Z max <input id="zmax" type="range"></label><label>N min <input id="nmin" type="range"></label><label>N max <input id="nmax" type="range"></label><span id="rangeText" style="color:#a9b0c2;font-size:13px"></span></div>
<script>
const DATA_URL='https://raw.githubusercontent.com/posit-dev/great-tables/main/great_tables/data/16-nuclides.csv';
const c=document.getElementById('c'),ctx=c.getContext('2d'),hud=document.getElementById('hud'),info=document.getElementById('info');
let S={nodes:[],links:[],by:new Map(),mode:'move',labels:true,showDots:true,showLines:true,showArrows:true,linkTypes:{isotope:true,'beta-':true,'beta+/ec':true,alpha:true},sel:null,hover:null,zoom:.85,panX:0,panY:20,rx:-.72,ry:.78,down:false,orbiting:false,panning:false,lastX:0,lastY:0,minZ:0,maxZ:1,minN:0,maxN:1,aMinZ:0,aMaxZ:10,aMinN:0,aMaxN:10,zScale:42,nScale:32,yScale:360,sweep:null,fadeIn:new Map(),fadeOut:new Map(),fadeMs:650,lastVisible:new Set(),bandPadN:2,zWindow:12};
function parseCSV(t){let rows=[],row=[],cell='',q=false;for(let i=0;i<t.length;i++){let ch=t[i],n=t[i+1];if(q){if(ch=='"'&&n=='"'){cell+='"';i++}else if(ch=='"')q=false;else cell+=ch}else{if(ch=='"')q=true;else if(ch==','){row.push(cell);cell=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&n=='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell=''}else cell+=ch}}row.push(cell);if(row.some(v=>v.trim()))rows.push(row);let h=rows.shift().map(v=>v.trim());return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()])))}
function num(v){let n=Number(v);return isFinite(n)?n:NaN}
function pct(v){if(v==null||String(v).trim()==='')return '';let n=Number(v);if(!isFinite(n))return String(v);return n<=1?(n*100).toPrecision(4)+'%':n.toPrecision(4)+'%'}
function rowModes(r,stable){if(stable)return[{mode:'Stable',prob:'100%'}];let out=[];for(let i=1;i<=3;i++){let d=(r['decay_'+i]||'').trim();if(d)out.push({mode:d,prob:pct(r['decay_'+i+'_pct']),energy:num(r['decay_'+i+'_energy']||r['decay_'+i+'_q']||r['q_'+i])})}let d=(r.decay||r.decay_1||'').trim();if(!out.length&&d)out.push({mode:d,prob:pct(r.decay_pct||''),energy:num(r.q_value||r.q||r.decay_energy||r.energy_mev)});return out.length?out:[{mode:'Unknown / not listed',prob:'',energy:NaN}]}
function explicitEnergy(r){let keys=['q_value','q','decay_energy','energy','energy_mev','q_mev','decay_q'];for(let k of keys){let v=num(r[k]);if(isFinite(v))return v}return NaN}
function load(text){let rows=parseCSV(text),seen=new Set();S.nodes=[];S.by=new Map();for(let r of rows){let Z=+r.z,N=+r.n,A=Z+N,sym=r.element,el=sym,stableText=r.is_stable,decay=r.decay_1||'',half=r.half_life||'';if(!isFinite(Z)){Z=+r.Z;N=+r.N;A=+r.A||Z+N;sym=r.symbol;el=r.element||sym;stableText=r.stable;decay=r.decay||'';half=r.half_life||''}if(!sym||!isFinite(Z)||!isFinite(N)||Z<0||N<0)continue;let key=Z+','+N;if(seen.has(key))continue;seen.add(key);let stable=/true|yes|stable/i.test(stableText)||/^stable$/i.test(decay);if(stable){decay='Stable';half='Stable'}let modes=rowModes(r,stable);let node={Z,N,A,sym,el,stable,decay,half,modes,energy:explicitEnergy(r),x:0,y:0,z:0,sx:0,sy:0,depth:0,label(){return this.sym+'-'+this.A},rad(){return this.stable?8:6},key(){return this.Z+','+this.N}};S.nodes.push(node);S.by.set(key,node)}setBounds();buildLinks();setupSliders();layoutAll();resetView();}
function setBounds(){S.minZ=Math.min(...S.nodes.map(n=>n.Z));S.maxZ=Math.max(...S.nodes.map(n=>n.Z));S.minN=Math.min(...S.nodes.map(n=>n.N));S.maxN=Math.max(...S.nodes.map(n=>n.N));S.aMinZ=S.minZ;S.aMaxZ=Math.min(10,S.maxZ);S.aMinN=S.minN;S.aMaxN=Math.min(10,S.maxN)}
function modeText(n){return(n.modes||[]).map(x=>String(x.mode||'').toLowerCase()).join(' ')}
function hasMode(n,t){if(n.stable)return false;let m=modeText(n);if(t==='beta-')return /b-|beta-|β-/.test(m);if(t==='beta+/ec')return /b\+|beta\+|β\+|ec|electron/.test(m);if(t==='alpha')return /(^|\W)(a|alpha|α)(\W|$)/.test(m);return true}
function energyForType(n,t){if(t==='isotope')return 0;if(isFinite(n.energy))return Math.abs(n.energy);let modes=n.modes||[];for(let m of modes){let s=String(m.mode||'').toLowerCase();if(t==='beta-'&&/(b-|beta-|β-)/.test(s)&&isFinite(m.energy))return Math.abs(m.energy);if(t==='beta+/ec'&&/(b\+|beta\+|β\+|ec|electron)/.test(s)&&isFinite(m.energy))return Math.abs(m.energy);if(t==='alpha'&&/(^|\W)(a|alpha|α)(\W|$)/.test(s)&&isFinite(m.energy))return Math.abs(m.energy)}return t==='alpha'?5.5:t==='beta-'?1.0:t==='beta+/ec'?1.8:0}
function energyLabel(n,t){if(t==='isotope')return 'isotope chain / no decay energy';let e=energyForType(n,t),explicit=isFinite(n.energy)||(n.modes||[]).some(m=>isFinite(m.energy));return e.toFixed(2)+' MeV '+(explicit?'':'estimate')}
function buildLinks(){S.links=[];let seen=new Set();for(let n of S.nodes){add(n,S.by.get(n.Z+','+(n.N+1)),'isotope',seen);if(n.stable)continue;let b=S.by.get((n.Z+1)+','+(n.N-1));if(b&&b.A===n.A&&hasMode(n,'beta-'))add(n,b,'beta-',seen);b=S.by.get((n.Z-1)+','+(n.N+1));if(b&&b.A===n.A&&hasMode(n,'beta+/ec'))add(n,b,'beta+/ec',seen);b=S.by.get((n.Z-2)+','+(n.N-2));if(b&&n.A-b.A===4&&hasMode(n,'alpha'))add(n,b,'alpha',seen)}}
function add(a,b,type,seen){if(!a||!b)return;let k=a.key()+'|'+b.key()+'|'+type,kr=b.key()+'|'+a.key()+'|'+type;if(seen.has(k)||seen.has(kr))return;seen.add(k);S.links.push({a,b,type})}
function setupSliders(){for(let [id,min,max,val] of [['zmin',S.minZ,S.maxZ,S.aMinZ],['zmax',S.minZ,S.maxZ,S.aMaxZ],['nmin',S.minN,S.maxN,S.aMinN],['nmax',S.minN,S.maxN,S.aMaxN]]){let e=document.getElementById(id);e.min=min;e.max=max;e.value=val}sweepSize.max=Math.max(4,Math.min(60,S.maxZ-S.minZ));S.zWindow=Math.min(+sweepSize.value,+sweepSize.max);sweepSize.value=S.zWindow;sweepSizeText.textContent=S.zWindow;zScale.value=S.zScale;nScale.value=S.nScale;yScale.value=S.yScale;syncScaleLabels();updateRanges(false)}
function syncScaleLabels(){zScaleText.textContent=S.zScale;nScaleText.textContent=S.nScale;yScaleText.textContent=S.yScale}
function setAxisScale(axis,val){S[axis]=+val;syncScaleLabels();layoutAll()}
function halfLifeSeconds(n){if(n.stable)return Infinity;let h=Number(n.half);return isFinite(h)&&h>0?h:NaN}
function instability(n){if(n.stable)return 0;let h=halfLifeSeconds(n);if(!isFinite(h))return .55;let log=Math.log10(1+h);return 1-Math.max(0,Math.min(1,log/20))}
function stabilityLabel(n){if(n.stable)return 'stable / center plane';let h=halfLifeSeconds(n);return isFinite(h)?'instability '+instability(n).toFixed(2)+' / log10(1+t½ s) '+Math.log10(1+h).toFixed(2):'half-life unknown'}
function layoutAll(){let cz=(S.aMinZ+S.aMaxZ)/2,cn=(S.aMinN+S.aMaxN)/2;for(let n of S.nodes){n.x=(n.Z-cz)*S.zScale;n.z=(n.N-cn)*S.nScale;n.y=-instability(n)*S.yScale}}
function currentVisibleSet(){let s=new Set();for(let n of S.nodes)if(visible(n))s.add(n.key());return s}
function occupiedNWindow(zlo,zhi){let ns=S.nodes.filter(n=>n.Z>=zlo&&n.Z<=zhi).map(n=>n.N);if(!ns.length)return{nlo:S.minN,nhi:Math.min(S.minN+S.zWindow,S.maxN)};return{nlo:Math.max(S.minN,Math.min(...ns)-S.bandPadN),nhi:Math.min(S.maxN,Math.max(...ns)+S.bandPadN)}}
function updateRanges(animate=true){let z1=+zmin.value,z2=+zmax.value,n1=+nmin.value,n2=+nmax.value;if(z1>z2)[z1,z2]=[z2,z1];if(n1>n2)[n1,n2]=[n2,n1];let old=S.lastVisible.size?S.lastVisible:currentVisibleSet();S.aMinZ=z1;S.aMaxZ=z2;S.aMinN=n1;S.aMaxN=n2;rangeText.textContent=`Z ${z1}–${z2} · N ${n1}–${n2}`;layoutAll();if(S.sel&&!visible(S.sel))S.sel=null;if(S.sweep&&animate){let now=performance.now(),neu=currentVisibleSet();for(let k of old)if(!neu.has(k)){let n=S.by.get(k);if(n)S.fadeOut.set(k,{node:n,x:n.x,y:n.y,z:n.z,start:now})}for(let k of neu)if(!old.has(k))S.fadeIn.set(k,now);S.lastVisible=neu}}
function setSliderWindow(zlo,zhi,nlo,nhi,a=true){zmin.value=Math.max(S.minZ,Math.min(S.maxZ,zlo));zmax.value=Math.max(S.minZ,Math.min(S.maxZ,zhi));nmin.value=Math.max(S.minN,Math.min(S.maxN,nlo));nmax.value=Math.max(S.minN,Math.min(S.maxN,nhi));updateRanges(a)}
function setSweepWindow(zlo,a=true){let zhi=Math.min(S.maxZ,zlo+S.zWindow),w=occupiedNWindow(zlo,zhi);setSliderWindow(zlo,zhi,w.nlo,w.nhi,a)}
function setSweepSize(v){S.zWindow=+v;sweepSizeText.textContent=S.zWindow;if(S.sweep)setSweepWindow(S.sweep.zlo,true)}
function startSweep(){if(!S.nodes.length)return;if(S.sweep){stopSweep();return}let zlo=Math.max(S.minZ,0);S.fadeIn.clear();S.fadeOut.clear();setSweepWindow(zlo,false);let now=performance.now();S.lastVisible=currentVisibleSet();for(let k of S.lastVisible)S.fadeIn.set(k,now);sweepBtn.classList.add('running');sweepBtn.textContent='Stop animation';S.sweep={zlo,timer:null};setTimeout(()=>{if(!S.sweep)return;S.sweep.timer=setInterval(()=>{if(!S.sweep)return;S.sweep.zlo++;setSweepWindow(S.sweep.zlo,true);if(S.sweep.zlo>=S.maxZ)stopSweep()},250)},900)}
function stopSweep(){if(S.sweep&&S.sweep.timer)clearInterval(S.sweep.timer);S.sweep=null;S.fadeOut.clear();S.lastVisible=currentVisibleSet();sweepBtn.classList.remove('running');sweepBtn.textContent='Animate sweep'}
function fadeInAlpha(n){if(!S.sweep)return 1;let t=S.fadeIn.get(n.key());return t==null?1:Math.max(0,Math.min(1,(performance.now()-t)/S.fadeMs))}
function fadeOutAlpha(k){let o=S.fadeOut.get(k);if(!o)return 0;let a=1-(performance.now()-o.start)/S.fadeMs;if(a<=0){S.fadeOut.delete(k);return 0}return a}
function resetLayout(){layoutAll()}function resetView(){S.zoom=.85;S.panX=0;S.panY=20;S.rx=-.72;S.ry=.78}
function visible(n){return n.Z>=S.aMinZ&&n.Z<=S.aMaxZ&&n.N>=S.aMinN&&n.N<=S.aMaxN}function linkTypeVisible(t){return !!S.linkTypes[t]}function linkVisible(l){return visible(l.a)&&visible(l.b)&&linkTypeVisible(l.type)}
function projectObj(o){let cy=Math.cos(S.ry),sy=Math.sin(S.ry),x1=o.x*cy+o.z*sy,z1=-o.x*sy+o.z*cy,cx=Math.cos(S.rx),sx=Math.sin(S.rx),y2=o.y*cx-z1*sx,z2=o.y*sx+z1*cx;return{x:c.clientWidth/2+S.panX+x1*S.zoom,y:c.clientHeight/2+S.panY+y2*S.zoom,depth:z2}}
function project(n){let p=projectObj(n);n.sx=p.x;n.sy=p.y;n.depth=p.depth}function ds(d){return Math.max(.65,Math.min(1.35,1+d*.0008))}function nodeColor(n){let h=(n.Z*137.508)%360;return `hsl(${h} 78% ${n.stable?58:34}%)`}function lineRGB(t){return t==='isotope'?'120,160,255':t==='beta-'?'40,170,255':t==='beta+/ec'?'255,80,240':t==='alpha'?'255,145,30':'150,150,150'}function rgba(rgb,a){return `rgba(${rgb},${a})`}function lineWidth(l){if(l.type==='isotope')return 1.1;let e=energyForType(l.a,l.type);return Math.max(1.4,Math.min(8.5,1.4+1.15*Math.sqrt(Math.max(0,e))))}function lineAlpha(t){return t==='isotope'?.28:.74}
function exitProxy(k){let o=S.fadeOut.get(k);if(!o)return null;let p=projectObj(o);return{node:o.node,x:o.x,y:o.y,z:o.z,sx:p.x,sy:p.y,depth:p.depth,alpha:fadeOutAlpha(k)}}function drawableFor(n){if(visible(n))return{node:n,x:n.x,y:n.y,z:n.z,sx:n.sx,sy:n.sy,depth:n.depth,alpha:fadeInAlpha(n)};return exitProxy(n.key())}
function drawAxes(){let cx=(S.aMinZ+S.aMaxZ)/2,cn=(S.aMinN+S.aMaxN)/2,z0=projectObj({x:(S.minZ-cx)*S.zScale,y:0,z:(S.aMinN-cn)*S.nScale}),z1=projectObj({x:(S.maxZ-cx)*S.zScale,y:0,z:(S.aMinN-cn)*S.nScale}),n1=projectObj({x:(S.aMinZ-cx)*S.zScale,y:0,z:(S.maxN-cn)*S.nScale}),y1=projectObj({x:(S.aMinZ-cx)*S.zScale,y:-S.yScale,z:(S.aMinN-cn)*S.nScale});ctx.lineWidth=1;ctx.strokeStyle='rgba(255,255,255,.16)';ctx.beginPath();ctx.moveTo(z0.x,z0.y);ctx.lineTo(z1.x,z1.y);ctx.moveTo(z0.x,z0.y);ctx.lineTo(n1.x,n1.y);ctx.moveTo(z0.x,z0.y);ctx.lineTo(y1.x,y1.y);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.55)';ctx.font='12px system-ui';ctx.fillText('Z →',z1.x+8,z1.y);ctx.fillText('N into screen',n1.x+8,n1.y);ctx.fillText('less stable ↑',y1.x+8,y1.y)}
function draw(){resize();S.nodes.forEach(n=>{if(visible(n))project(n)});S.hover=closest(S.lastX,S.lastY);ctx.clearRect(0,0,c.clientWidth,c.clientHeight);drawAxes();let drawLinks=[];if(S.showLines){for(let l of S.links){if(!linkTypeVisible(l.type))continue;let a=drawableFor(l.a),b=drawableFor(l.b);if(a&&b&&a.alpha>0&&b.alpha>0)drawLinks.push({l,a,b,alpha:Math.min(a.alpha,b.alpha)})}}drawLinks.sort((x,y)=>(x.a.depth+x.b.depth)-(y.a.depth+y.b.depth));for(let d of drawLinks){let l=d.l;ctx.strokeStyle=rgba(lineRGB(l.type),lineAlpha(l.type)*d.alpha);ctx.lineWidth=lineWidth(l);ctx.beginPath();ctx.moveTo(d.a.sx,d.a.sy);ctx.lineTo(d.b.sx,d.b.sy);ctx.stroke();if(S.showArrows&&l.type!=='isotope')arrow(d)}let drawNodes=[];for(let n of S.nodes){if(visible(n))drawNodes.push({node:n,sx:n.sx,sy:n.sy,depth:n.depth,alpha:fadeInAlpha(n)});else{let ex=exitProxy(n.key());if(ex&&ex.alpha>0)drawNodes.push({node:ex.node,sx:ex.sx,sy:ex.sy,depth:ex.depth,alpha:ex.alpha})}}drawNodes.sort((a,b)=>a.depth-b.depth);if(S.showDots)for(let d of drawNodes){let n=d.node,r=Math.max(3,Math.min(13,n.rad()*S.zoom*ds(d.depth)));ctx.globalAlpha=d.alpha;ctx.fillStyle=nodeColor(n);ctx.beginPath();ctx.arc(d.sx,d.sy,r,0,7);ctx.fill();ctx.globalAlpha=1;if(n===S.sel||n===S.hover){ctx.strokeStyle='white';ctx.lineWidth=2;ctx.beginPath();ctx.arc(d.sx,d.sy,r+5,0,7);ctx.stroke()}}if(S.labels)for(let d of drawNodes){let n=d.node,act=n===S.sel||n===S.hover;ctx.globalAlpha=d.alpha;ctx.font=`${act?'700':'400'} ${act?15:10}px system-ui`;ctx.textAlign='center';ctx.fillStyle=act?'white':'rgba(215,215,215,.92)';ctx.fillText(n.label(),d.sx,d.sy-(act?21:15));ctx.globalAlpha=1}updateUI()}
function arrow(d){let l=d.l,dx=d.b.sx-d.a.sx,dy=d.b.sy-d.a.sy,len=Math.hypot(dx,dy);if(len<1)return;dx/=len;dy/=len;let r=Math.max(3,Math.min(13,l.b.rad()*S.zoom*ds(d.b.depth))),tx=d.b.sx-dx*(r+3),ty=d.b.sy-dy*(r+3),bx=tx-dx*15,by=ty-dy*15,px=-dy,py=dx,w=Math.max(7,lineWidth(l)+3);ctx.fillStyle=rgba(lineRGB(l.type),lineAlpha(l.type)*d.alpha);ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(bx+px*w,by+py*w);ctx.lineTo(bx-px*w,by-py*w);ctx.closePath();ctx.fill()}

function formatHalf(h){let s=+h;if(!isFinite(s))return h||'—';if(s<60)return s.toPrecision(4)+' s';if(s<3600)return(s/60).toPrecision(4)+' min';if(s<86400)return(s/3600).toPrecision(4)+' hr';if(s<31557600)return(s/86400).toPrecision(4)+' d';return(s/31557600).toPrecision(4)+' yr'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function resize(){let d=window.devicePixelRatio||1,w=Math.round(c.clientWidth*d),h=Math.round(c.clientHeight*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h;ctx.setTransform(d,0,0,d,0,0)}}
function setMode(m){S.mode=m;[move,orbit,pan].forEach(b=>b.classList.remove('active'));({move,orbit,pan}[m]).classList.add('active')}function setLinkType(type,val){S.linkTypes[type]=val;linkIsotope.checked=S.linkTypes.isotope;linkBetaMinus.checked=S.linkTypes['beta-'];linkBetaPlus.checked=S.linkTypes['beta+/ec'];linkAlpha.checked=S.linkTypes.alpha}
c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);S.down=true;S.lastX=e.clientX;S.lastY=e.clientY;if(e.button===2||S.mode==='pan'){S.panning=true;return}if(S.mode==='orbit'){S.orbiting=true;return}S.sel=closest(e.clientX,e.clientY);S.panning=!S.sel};c.onpointermove=e=>{let dx=e.clientX-S.lastX,dy=e.clientY-S.lastY;if(S.down){if(S.orbiting){S.ry+=dx*.01;S.rx=Math.max(-Math.PI/2,Math.min(Math.PI/2,S.rx+dy*.01))}else if(S.panning){S.panX+=dx;S.panY+=dy}}S.lastX=e.clientX;S.lastY=e.clientY};c.onpointerup=()=>{S.down=false;S.panning=false;S.orbiting=false};c.oncontextmenu=e=>e.preventDefault();c.onwheel=e=>{e.preventDefault();let old=S.zoom,f=e.deltaY<0?1.1:.9;S.zoom=Math.max(.08,Math.min(8,S.zoom*f));let mx=e.clientX,my=e.clientY;S.panX=mx-c.clientWidth/2-(mx-c.clientWidth/2-S.panX)*(S.zoom/old);S.panY=my-c.clientHeight/2-(my-c.clientHeight/2-S.panY)*(S.zoom/old)};
window.onkeydown=e=>{let k=e.key.toLowerCase();if(k==='m')setMode('move');else if(k==='o')setMode('orbit');else if(k==='p')setMode('pan');else if(k==='r')resetLayout();else if(k==='v')resetView();else if(k==='l'){S.labels=!S.labels;labels.checked=S.labels}else if(k==='d'){S.showDots=!S.showDots;dots.checked=S.showDots}else if(k==='x'){S.showLines=!S.showLines;lineToggle.checked=S.showLines}else if(k==='h'){S.showArrows=!S.showArrows;arrows.checked=S.showArrows}else if(k==='a')startSweep();else if(k==='1')setLinkType('isotope',!S.linkTypes.isotope);else if(k==='2')setLinkType('beta-',!S.linkTypes['beta-']);else if(k==='3')setLinkType('beta+/ec',!S.linkTypes['beta+/ec']);else if(k==='4')setLinkType('alpha',!S.linkTypes.alpha)};
move.onclick=()=>setMode('move');orbit.onclick=()=>setMode('orbit');pan.onclick=()=>setMode('pan');resetL.onclick=resetLayout;resetV.onclick=resetView;sweepBtn.onclick=startSweep;sweepSize.oninput=()=>setSweepSize(sweepSize.value);zScale.oninput=()=>setAxisScale('zScale',zScale.value);nScale.oninput=()=>setAxisScale('nScale',nScale.value);yScale.oninput=()=>setAxisScale('yScale',yScale.value);lineToggle.onchange=()=>S.showLines=lineToggle.checked;arrows.onchange=()=>S.showArrows=arrows.checked;dots.onchange=()=>S.showDots=dots.checked;labels.onchange=()=>S.labels=labels.checked;linkIsotope.onchange=()=>setLinkType('isotope',linkIsotope.checked);linkBetaMinus.onchange=()=>setLinkType('beta-',linkBetaMinus.checked);linkBetaPlus.onchange=()=>setLinkType('beta+/ec',linkBetaPlus.checked);linkAlpha.onchange=()=>setLinkType('alpha',linkAlpha.checked);[zmin,zmax,nmin,nmax].forEach(e=>e.oninput=updateRanges);function loop(){draw();requestAnimationFrame(loop)}fetch(DATA_URL).then(r=>r.text()).then(load).catch(()=>load('Z,N,A,symbol,element,stable,decay,half_life\n1,0,1,H,Hydrogen,true,Stable,Stable\n1,1,2,H,Hydrogen,true,Stable,Stable\n1,2,3,H,Hydrogen,false,B-,388781328\n2,1,3,He,Helium,true,Stable,Stable\n2,2,4,He,Helium,true,Stable,Stable\n6,6,12,C,Carbon,true,Stable,Stable\n6,8,14,C,Carbon,false,B-,179874478055\n8,8,16,O,Oxygen,true,Stable,Stable'));loop();
