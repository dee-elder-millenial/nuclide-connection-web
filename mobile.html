<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>H.A.N.K. Mobile</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#020205;color:#f4f7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
#stage{position:fixed;inset:0;overflow:hidden;background:#020205;touch-action:none}
#content{position:absolute;left:0;top:0;width:100vw;height:100vh;transform-origin:0 0;will-change:transform}
iframe{width:100vw;height:100vh;border:0;background:#020205;display:block}
#mobilePanel{position:fixed;z-index:20;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;justify-content:space-between;background:rgba(9,10,16,.86);border:1px solid #263044;border-radius:14px;padding:8px 10px;backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
#mobilePanel .title{font-size:12px;font-weight:700;color:#dbeafe;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mobilePanel .hint{font-size:11px;color:#a9b0c2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:center}
button,a{background:#111827;color:#f4f7ff;border:1px solid #334155;border-radius:10px;padding:7px 9px;font-size:12px;text-decoration:none;white-space:nowrap}
@media(max-width:420px){#mobilePanel{left:6px;right:6px;padding:7px 8px}.hint{display:none}.title{max-width:135px}}
</style>
</head>
<body>
<div id="stage"><div id="content"><iframe id="viewer" src="index.html"></iframe></div></div>
<div id="mobilePanel"><span class="title">H.A.N.K. Mobile</span><span class="hint">Pinch anywhere to zoom. Drag with one finger inside the viewer.</span><button id="resetZoom">Reset zoom</button><a href="index.html">Desktop</a></div>
<script>
const stage=document.getElementById('stage');
const content=document.getElementById('content');
const viewer=document.getElementById('viewer');
const resetZoom=document.getElementById('resetZoom');
let scale=1, tx=0, ty=0;
let pinch=null;
let touches=new Map();
function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
function apply(){content.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function mid(a,b){return {x:(a.x+b.x)/2,y:(a.y+b.y)/2};}
function startPinch(){
  const pts=[...touches.values()];
  if(pts.length<2)return;
  const m=mid(pts[0],pts[1]);
  pinch={d:Math.max(1,dist(pts[0],pts[1])),scale,tx,ty,m};
}
function updatePinch(){
  const pts=[...touches.values()];
  if(pts.length<2||!pinch)return;
  const m=mid(pts[0],pts[1]);
  const nextScale=clamp(pinch.scale*(dist(pts[0],pts[1])/pinch.d),0.55,5);
  const worldX=(pinch.m.x-pinch.tx)/pinch.scale;
  const worldY=(pinch.m.y-pinch.ty)/pinch.scale;
  scale=nextScale;
  tx=m.x-worldX*scale;
  ty=m.y-worldY*scale;
  apply();
}
function onPointerDown(e){
  if(e.pointerType!=='touch')return;
  touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(touches.size===2){e.preventDefault();startPinch();}
}
function onPointerMove(e){
  if(e.pointerType!=='touch'||!touches.has(e.pointerId))return;
  touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(touches.size>=2){e.preventDefault();updatePinch();}
}
function onPointerUp(e){
  if(e.pointerType!=='touch')return;
  touches.delete(e.pointerId);
  if(touches.size<2)pinch=null;
  if(touches.size===2)startPinch();
}
function installInFrame(){
  try{
    const doc=viewer.contentDocument;
    if(!doc)return;
    const style=doc.createElement('style');
    style.textContent='html,body,canvas{touch-action:none!important;} #hud{display:none!important;} @media(max-width:900px){#info{max-height:160px!important}}';
    doc.head.appendChild(style);
    doc.addEventListener('pointerdown',onPointerDown,{passive:false});
    doc.addEventListener('pointermove',onPointerMove,{passive:false});
    doc.addEventListener('pointerup',onPointerUp,{passive:false});
    doc.addEventListener('pointercancel',onPointerUp,{passive:false});
  }catch(err){console.warn('Could not install mobile pinch handlers',err);}
}
viewer.addEventListener('load',installInFrame);
stage.addEventListener('pointerdown',onPointerDown,{passive:false});
stage.addEventListener('pointermove',onPointerMove,{passive:false});
stage.addEventListener('pointerup',onPointerUp,{passive:false});
stage.addEventListener('pointercancel',onPointerUp,{passive:false});
resetZoom.onclick=()=>{scale=1;tx=0;ty=0;pinch=null;touches.clear();apply();};
apply();
</script>
</body>
</html>
