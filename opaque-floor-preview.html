<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=8, user-scalable=yes"><title>H.A.N.K. Opaque Floor Preview</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#020205}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}#note{position:fixed;left:12px;bottom:12px;z-index:999999;background:rgba(9,10,16,.9);color:#f4f7ff;border:1px solid #20263a;border-radius:14px;padding:8px 10px;font:12px system-ui;box-shadow:0 10px 30px rgba(0,0,0,.35);backdrop-filter:blur(8px)}#note b{color:#7dd3fc}</style></head><body><iframe id="frame" src="./index.html"></iframe><div id="note"><b>Preview:</b> floor map cells are opaque, and the selector label is clarified.</div><script>const frame=document.getElementById('frame');function install(){const d=frame.contentDocument;if(!d||d.getElementById('opaque-floor-patch'))return;const s=d.createElement('script');s.id='opaque-floor-patch';s.textContent=String.raw`
if(!window.__opaqueFloorPatch){
  window.__opaqueFloorPatch=true;
  const hm=document.getElementById('heightMode');
  if(hm&&hm.parentNode){for(const n of [...hm.parentNode.childNodes]){if(n.nodeType===3&&n.nodeValue.includes('Height'))n.nodeValue=n.nodeValue.replace('Height','Display');}}
  if(typeof drawZNFloorMap==='function'){
    drawZNFloorMap=function(){
      if(!S.showFloor)return;
      let cells=S.nodes.filter(visible).sort((a,b)=>a.N-b.N||a.Z-b.Z);
      ctx.save();ctx.lineJoin='round';
      for(let n of cells)drawPoly(floorCellAt(n,0),floorColor(n),'rgba(255,255,255,.22)',1);
      ctx.restore();
      drawSelectedColumn();
    };
  }
}
`;d.body.appendChild(s)}frame.addEventListener('load',()=>setTimeout(install,300));</script></body></html>
