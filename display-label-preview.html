<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=8, user-scalable=yes"><title>H.A.N.K. Display Label Preview</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#020205}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style></head><body><iframe id="frame" src="./index.html"></iframe><script>const f=document.getElementById('frame');function patch(){const d=f.contentDocument;if(!d)return;const s=d.getElementById('heightMode');if(s&&s.parentElement){const nodes=[...s.parentElement.childNodes];for(const n of nodes){if(n.nodeType===3&&n.nodeValue.includes('Height'))n.nodeValue=n.nodeValue.replace('Height','Display');}}}f.addEventListener('load',()=>setTimeout(patch,300));</script></body></html>
