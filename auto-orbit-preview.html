<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=8, user-scalable=yes">
<title>H.A.N.K. Auto Orbit Preview</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#020205;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#020205}
#note{position:fixed;left:12px;bottom:12px;z-index:999999;background:rgba(9,10,16,.9);color:#f4f7ff;border:1px solid #20263a;border-radius:14px;padding:8px 10px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);backdrop-filter:blur(8px)}
#note b{color:#7dd3fc}
</style>
</head>
<body>
<iframe id="frame" src="./index.html"></iframe>
<div id="note"><b>Preview:</b> Auto Orbit keeps the visible table where it already is.</div>
<script>
const frame=document.getElementById('frame');
function installAutoOrbit(){
  const doc=frame.contentDocument;
  if(!doc||doc.getElementById('auto-orbit-patch'))return;
  const script=doc.createElement('script');
  script.id='auto-orbit-patch';
  script.textContent=String.raw`
    if(!window.__hankAutoOrbitPatch){
      window.__hankAutoOrbitPatch=true;
      const btn=document.createElement('button');
      btn.id='autoOrbit';
      btn.textContent='Auto Orbit';
      const orbitBtn=document.getElementById('orbit');
      if(orbitBtn&&orbitBtn.parentNode)orbitBtn.parentNode.insertBefore(btn,orbitBtn.nextSibling);

      function rectOf(el){
        if(!el)return null;
        const r=el.getBoundingClientRect();
        if(!r||r.width<=0||r.height<=0)return null;
        return r;
      }

      function openWorkspaceBounds(){
        const pad=14;
        let left=pad;
        let top=pad;
        let right=c.clientWidth-pad;
        let bottom=c.clientHeight-pad;
        const topR=rectOf(document.getElementById('top'));
        const hudR=rectOf(document.getElementById('hud'));
        const infoR=rectOf(document.getElementById('info'));
        const bottomR=rectOf(document.getElementById('bottom'));
        if(topR)top=Math.max(top,topR.bottom+pad);
        if(hudR&&hudR.left<right&&hudR.right>left&&hudR.top<bottom&&hudR.bottom>top)left=Math.max(left,hudR.right+pad);
        if(infoR&&infoR.left<right&&infoR.right>left&&infoR.top<bottom&&infoR.bottom>top)right=Math.min(right,infoR.left-pad);
        if(bottomR&&bottomR.left<right&&bottomR.right>left&&bottomR.top<bottom&&bottomR.bottom>top){
          if(bottomR.left<c.clientWidth*.55)left=Math.max(left,bottomR.right+pad);
          else right=Math.min(right,bottomR.left-pad);
        }
        if(right-left<160){left=pad;right=c.clientWidth-pad;if(infoR)right=Math.min(right,infoR.left-pad);}
        if(bottom-top<140){top=topR?topR.bottom+pad:pad;bottom=c.clientHeight-pad;}
        return {left,top,right,bottom,x:(left+right)/2,y:(top+bottom)/2};
      }

      function visibleTablePivot(){
        const b=openWorkspaceBounds();
        let minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity,count=0;
        for(const n of S.nodes){
          if(!visible(n))continue;
          const p=projectObj(n);
          if(p.x<b.left||p.x>b.right||p.y<b.top||p.y>b.bottom)continue;
          minX=Math.min(minX,n.x); maxX=Math.max(maxX,n.x);
          minZ=Math.min(minZ,n.z); maxZ=Math.max(maxZ,n.z);
          count++;
        }
        if(count>0){
          const pivot={x:(minX+maxX)/2,y:0,z:(minZ+maxZ)/2};
          const p=projectObj(pivot);
          return {pivot,screen:{x:p.x,y:p.y},count};
        }
        const fallback={x:b.x,y:b.y};
        return {pivot:planePointAtScreen(fallback.x,fallback.y),screen:fallback,count:0};
      }

      function planePointAtScreen(screenX,screenY){
        const zoom=S.zoom||1;
        const x1=(screenX-c.clientWidth/2-S.panX)/zoom;
        const y2=(screenY-c.clientHeight/2-S.panY)/zoom;
        const sx=Math.sin(S.rx), cy=Math.cos(S.ry), sy=Math.sin(S.ry);
        let z1=Math.abs(sx)>1e-4 ? -y2/sx : 0;
        return {x:x1*cy-z1*sy,y:0,z:x1*sy+z1*cy};
      }
      function startAutoOrbit(){
        const target=visibleTablePivot();
        S.autoOrbit=true;
        S.autoPivot=target.pivot;
        S.autoScreen=target.screen;
        btn.textContent='Stop Auto Orbit';
        btn.classList.add('active');
      }
      function stopAutoOrbit(){
        S.autoOrbit=false;
        btn.textContent='Auto Orbit';
        btn.classList.remove('active');
      }
      function autoOrbitStep(){
        if(S.autoOrbit&&S.autoPivot&&S.autoScreen){
          S.ry+=0.006;
          const after=projectObj(S.autoPivot);
          S.panX+=S.autoScreen.x-after.x;
          S.panY+=S.autoScreen.y-after.y;
        }
        requestAnimationFrame(autoOrbitStep);
      }
      btn.onclick=()=>{S.autoOrbit?stopAutoOrbit():startAutoOrbit();};
      c.addEventListener('pointerdown',()=>{if(S.autoOrbit)stopAutoOrbit();},true);
      document.getElementById('resetV')?.addEventListener('click',()=>{if(S.autoOrbit)stopAutoOrbit();},true);
      autoOrbitStep();
    }
  `;
  doc.body.appendChild(script);
}
frame.addEventListener('load',()=>[100,500,1200,2200].forEach(t=>setTimeout(installAutoOrbit,t)));
</script>
</body>
</html>
