function buildLinks(){clearGroup(linkGroup);let seen=new Set();function add(a,b,type){if(!a||!b||!visibleNode(a)||!visibleNode(b)||!lineEnabled(type))return;let k=a.key+'|'+b.key+'|'+type,kr=b.key+'|'+a.key+'|'+type;if(seen.has(k)||seen.has(kr))return;seen.add(k);addLine(a,b,type)}for(const n of currentNodes()){add(n,S.by.get(n.Z+','+(n.N+1)),'isotope');if(n.stable)continue;for(const mode of n.modes){let d=cleanMode(mode.mode);if(!d||d==='stable')continue;if(d.includes('b-')||d.includes('beta-'))add(n,S.by.get((n.Z+1)+','+(n.N-1)),'beta-');if(d.includes('ec')||d.includes('b+')||d.includes('beta+'))add(n,S.by.get((n.Z-1)+','+(n.N+1)),'beta+/ec');if(d==='a'||d==='alpha')add(n,S.by.get((n.Z-2)+','+(n.N-2)),'alpha');if(d==='p'||d==='2p')add(n,S.by.get((n.Z-(d==='2p'?2:1))+','+n.N),'proton');if(d==='n'||d==='2n')add(n,S.by.get(n.Z+','+(n.N-(d==='2n'?2:1))),'neutron');if(d.includes('b-p')||d.includes('b+p')||d.includes('b-a')||d.includes('b+a')||d.includes('b-n')||d.includes('b-2n'))add(n,S.by.get((d.includes('b+')?n.Z-1:n.Z+1)+','+(d.includes('b+')?n.N+1:n.N-1)),'delayed')}}}
function showInfo(n){S.selected=n;if(!n){info.innerHTML='<div class="eyebrow">Selection</div><h2>None</h2><div class="status">Click a nuclide sphere.</div><div class="detail"><span>Renderer</span><span>Three.js/WebGL with real depth testing.</span></div><div class="detail"><span>Build</span><span>'+BUILD+'</span></div>';return}let q=weightedDecayEnergy(n);info.innerHTML=`<div class="eyebrow">Element: ${n.el}</div><h2>${n.label}</h2><div class="status">${n.stable?'Stable isotope':'Radioactive isotope'}</div><div class="detail"><span>Protons Z</span><span>${n.Z}</span></div><div class="detail"><span>Neutrons N</span><span>${n.N}</span></div><div class="detail"><span>Mass A</span><span>${n.A}</span></div><div class="detail"><span>Half-life</span><span>${n.stable?'Stable':n.half||'—'}</span></div><div class="detail"><span>Display</span><span>${S.displayMode==='decayEnergy'?'Decay energy':'Half-life'}</span></div><div class="detail"><span>Discovery year</span><span>${n.discYear||'unknown / not matched'}</span></div><div class="detail"><span>Weighted decay energy</span><span>${q>0?fmtQ(q):'—'}</span></div><div class="detail"><span>Decay modes</span><span>${n.modes.map(m=>m.mode+(m.prob?' '+m.prob:'')).join('<br>')}</span></div><div class="detail"><span>Build</span><span>${BUILD}</span></div>`}
function focusVisible(){let ns=currentNodes();if(!ns.length)return;let cz=(S.aMinZ+S.aMaxZ)/2,cn=(S.aMinN+S.aMaxN)/2;controls.target.set((cz-S.centerZ)*S.zScale,0,(cn-S.centerN)*S.nScale);controls.update()}
function setRange(z1,z2,n1,n2,focus=false){z1=Math.round(Math.max(S.minZ,Math.min(S.maxZ,z1)));z2=Math.round(Math.max(S.minZ,Math.min(S.maxZ,z2)));n1=Math.round(Math.max(S.minN,Math.min(S.maxN,n1)));n2=Math.round(Math.max(S.minN,Math.min(S.maxN,n2)));if(z1>z2)[z1,z2]=[z2,z1];if(n1>n2)[n1,n2]=[n2,n1];S.aMinZ=z1;S.aMaxZ=z2;S.aMinN=n1;S.aMaxN=n2;rangeText.textContent=`Z ${z1}–${z2} · N ${n1}–${n2}`;if(S.selected&&!visibleNode(S.selected))showInfo(null);buildScene();if(focus)focusVisible()}
function load(text){let rows=parseCSV(text),seen=new Set();S.nodes=[];S.by=new Map();for(let r of rows){let Z=+r.z,N=+r.n,A=Z+N,sym=r.element,el=sym,stableText=r.is_stable,decay=r.decay_1||'',half=r.half_life||'',mass=microMass(r.atomic_mass);if(!isFinite(Z)){Z=+r.Z;N=+r.N;A=+r.A||Z+N;sym=r.symbol;el=r.element||sym;stableText=r.stable;decay=r.decay||'';half=r.half_life||'';mass=microMass(r.atomic_mass||r.mass)}if(!sym||!isFinite(Z)||!isFinite(N)||Z<0||N<0)continue;let key=Z+','+N;if(seen.has(key))continue;seen.add(key);let stable=/true|yes|stable/i.test(stableText)||/^stable$/i.test(decay);if(stable){decay='Stable';half='Stable'}let node={Z,N,A,sym,el,stable,decay,half,mass,modes:rowModes(r,stable),key,label:sym+'-'+A,discYear:null};S.nodes.push(node);S.by.set(key,node);S.by.set(node.label,node)}S.minZ=Math.min(...S.nodes.map(n=>n.Z));S.maxZ=Math.max(...S.nodes.map(n=>n.Z));S.minN=Math.min(...S.nodes.map(n=>n.N));S.maxN=Math.max(...S.nodes.map(n=>n.N));S.centerZ=(S.minZ+S.maxZ)/2;S.centerN=(S.minN+S.maxN)/2;setRange(Math.max(1,S.minZ),Math.min(10,S.maxZ),Math.max(0,S.minN),Math.min(10,S.maxN),true);camera.position.set(60,90,135);controls.update();applyMoveSpeed();loadDiscoveryYears()}
function isotopeKeyFromText(txt){let s=String(txt||'').replace(/\[[^\]]*\]/g,'').replace(/\s+/g,'').replace(/[−–—]/g,'-');let m=s.match(/\^?(\d{1,3})(?:[gm]\d*)?([A-Z][a-z]{0,2})/);if(m)return m[2]+'-'+m[1];m=s.match(/([A-Z][a-z]{0,2})-?(\d{1,3})(?:[gm]\d*)?/);return m?m[1]+'-'+m[2]:null}
async function loadDiscoveryYears(){try{let r=await fetch(DISCOVERY_URL);let j=await r.json();let html=j?.parse?.text?.['*'];if(!html)throw new Error('No discovery table HTML');let doc=new DOMParser().parseFromString(html,'text/html'),yearMap=new Map();for(const tr of doc.querySelectorAll('tr')){let cells=[...tr.querySelectorAll('td,th')].map(td=>td.textContent.trim());let row=cells.join(' '),ym=row.match(/\b(18\d{2}|19\d{2}|20\d{2})\b/);if(!ym)continue;let y=Number(ym[1]);for(const cell of cells){let k=isotopeKeyFromText(cell);if(k&&!yearMap.has(k))yearMap.set(k,y)}}let matched=0;for(const [k,y] of yearMap){let n=S.by.get(k);if(n&&!n.discYear){n.discYear=y;matched++}}S.discoveryLoaded=true;S.discoveryMatched=matched;buildScene();if(S.selected)showInfo(S.selected)}catch(err){console.warn('Discovery year load failed',err);S.discoveryLoaded=true;S.discoveryMatched=0;hud.textContent=`Build ${BUILD} · discovery-year load failed; unmatched nuclides are kept visible.`}}
function mapArea(){let w=mapCanvas.clientWidth,h=mapCanvas.clientHeight;return{x:S.mapPad,y:S.mapPad,w:w-S.mapPad*2,h:h-S.mapPad*2}}
function resizeMiniMap(){let d=window.devicePixelRatio||1,w=Math.round(mapCanvas.clientWidth*d),h=Math.round(mapCanvas.clientHeight*d);if(mapCanvas.width!==w||mapCanvas.height!==h){mapCanvas.width=w;mapCanvas.height=h;mctx.setTransform(d,0,0,d,0,0);drawMiniMap()}}
function zToMap(z){let a=mapArea();return a.x+(z-S.minZ)/(S.maxZ-S.minZ||1)*a.w}
function nToMap(n){let a=mapArea();return a.y+a.h-(n-S.minN)/(S.maxN-S.minN||1)*a.h}
function mapToZ(x){let a=mapArea();return Math.round(S.minZ+(x-a.x)/a.w*(S.maxZ-S.minZ||1))}
function mapToN(y){let a=mapArea();return Math.round(S.minN+(a.y+a.h-y)/a.h*(S.maxN-S.minN||1))}
function mapColor(n){let h=n.stable?0:275*halfLifeHeight(n);return `hsl(${h} 88% ${n.stable?52:56}%)`}
function drawMapCorner(x,y,t){mctx.fillStyle=t==='min'?'rgba(125,211,252,.95)':'rgba(250,204,21,.95)';mctx.strokeStyle='white';mctx.lineWidth=1;mctx.beginPath();mctx.arc(x,y,7,0,7);mctx.fill();mctx.stroke()}
function drawMiniMap(){if(!S.nodes.length)return;resizeMiniMap();let w=mapCanvas.clientWidth,h=mapCanvas.clientHeight;mctx.clearRect(0,0,w,h);let a=mapArea();mctx.fillStyle='rgba(5,7,19,.96)';mctx.fillRect(0,0,w,h);mctx.strokeStyle='rgba(255,255,255,.12)';mctx.strokeRect(a.x,a.y,a.w,a.h);let x1=zToMap(S.aMinZ),x2=zToMap(S.aMaxZ),y1=nToMap(S.aMaxN),y2=nToMap(S.aMinN);for(let n of S.nodes){let x=zToMap(n.Z),y=nToMap(n.N),inside=visibleNode(n);mctx.globalAlpha=inside?1:.12;mctx.fillStyle=mapColor(n);mctx.fillRect(x-1.4,y-1.4,2.8,2.8)}mctx.globalAlpha=1;mctx.fillStyle='rgba(125,211,252,.08)';mctx.fillRect(x1,y1,x2-x1,y2-y1);mctx.strokeStyle='rgba(255,255,255,.9)';mctx.lineWidth=1.5;mctx.strokeRect(x1,y1,x2-x1,y2-y1);mctx.strokeStyle='rgba(125,211,252,.92)';mctx.beginPath();mctx.moveTo(x1,a.y);mctx.lineTo(x1,a.y+a.h);mctx.moveTo(a.x,y2);mctx.lineTo(a.x+a.w,y2);mctx.moveTo(x2,a.y);mctx.lineTo(x2,a.y+a.h);mctx.moveTo(a.x,y1);mctx.lineTo(a.x+a.w,y1);mctx.stroke();drawMapCorner(x1,y2,'min');drawMapCorner(x2,y1,'max')}
function mapPointer(e){let r=mapCanvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function pickMapHandle(x,y){let x1=zToMap(S.aMinZ),x2=zToMap(S.aMaxZ),y1=nToMap(S.aMaxN),y2=nToMap(S.aMinN),dMin=Math.hypot(x-x1,y-y2),dMax=Math.hypot(x-x2,y-y1);if(dMin<18)return'min';if(dMax<18)return'max';if(x>=x1&&x<=x2&&y>=y1&&y<=y2)return'move';return null}
mapCanvas.onpointerdown=e=>{e.preventDefault();mapCanvas.setPointerCapture(e.pointerId);let p=mapPointer(e),hit=pickMapHandle(p.x,p.y)||'move';S.mapDrag={type:hit,x:p.x,y:p.y,z1:S.aMinZ,z2:S.aMaxZ,n1:S.aMinN,n2:S.aMaxN}};
mapCanvas.onpointermove=e=>{if(!S.mapDrag)return;let p=mapPointer(e),z=mapToZ(p.x),n=mapToN(p.y),d=S.mapDrag;if(d.type==='min')setRange(Math.min(z,S.aMaxZ),S.aMaxZ,Math.min(n,S.aMaxN),S.aMaxN,true);else if(d.type==='max')setRange(S.aMinZ,Math.max(z,S.aMinZ),S.aMinN,Math.max(n,S.aMinN),true);else{let dz=z-mapToZ(d.x),dn=n-mapToN(d.y),w=d.z2-d.z1,h=d.n2-d.n1,nz1=Math.max(S.minZ,Math.min(S.maxZ-w,d.z1+dz)),nn1=Math.max(S.minN,Math.min(S.maxN-h,d.n1+dn));setRange(nz1,nz1+w,nn1,nn1+h,true)}};
mapCanvas.onpointerup=e=>{S.mapDrag=null};mapCanvas.onpointercancel=mapCanvas.onpointerup;
renderer.domElement.addEventListener('pointerdown',e=>{mouse.x=(e.clientX/innerWidth)*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(mouse,camera);let hits=raycaster.intersectObjects(nodeGroup.children,false);if(hits.length)showInfo(hits[0].object.userData.node)});
resetV.onclick=()=>{camera.position.set(60,90,135);focusVisible()};
autoOrbit.onclick=()=>{S.autoOrbit=!S.autoOrbit;autoOrbit.classList.toggle('active',S.autoOrbit);autoOrbit.textContent=S.autoOrbit?'Stop Auto Orbit':'Auto Orbit'};
moveSpeed.onchange=applyMoveSpeed;
heightScale.onchange=applyHeightScale;
discoveryYear.oninput=applyDiscoveryCutoff;
function syncLinkTypes(){S.linkTypes.isotope=linkIsotope.checked;S.linkTypes['beta-']=linkBetaMinus.checked;S.linkTypes['beta+/ec']=linkBetaPlus.checked;S.linkTypes.alpha=linkAlpha.checked;S.linkTypes.proton=linkProton.checked;S.linkTypes.neutron=linkNeutron.checked;S.linkTypes.delayed=linkDelayed.checked;S.showArrows=arrowsToggle.checked;buildLinks()}
[linkIsotope,linkBetaMinus,linkBetaPlus,linkAlpha,linkProton,linkNeutron,linkDelayed,arrowsToggle].forEach(el=>el.onchange=syncLinkTypes);
displayMode.onchange=()=>{S.displayMode=displayMode.value;buildScene();showInfo(S.selected)};
labelsToggle.onchange=()=>buildScene();
floorToggle.onchange=()=>floorGroup.visible=floorToggle.checked;
addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;let step=3.6*S.moveSpeed*(e.shiftKey?3:1),used=true;if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')moveCameraLocal(-step,0);else if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')moveCameraLocal(step,0);else if(e.key==='ArrowUp'||e.key.toLowerCase()==='w')moveCameraLocal(0,step);else if(e.key==='ArrowDown'||e.key.toLowerCase()==='s')moveCameraLocal(0,-step);else if(e.key==='PageUp'||e.key.toLowerCase()==='q')moveCameraLocal(0,0,step);else if(e.key==='PageDown'||e.key.toLowerCase()==='e')moveCameraLocal(0,0,-step);else if(e.key==='+'||e.key==='='){camera.position.lerp(controls.target,.09*S.moveSpeed);controls.update()}else if(e.key==='-'||e.key==='_'){camera.position.sub(controls.target).multiplyScalar(1+.09*S.moveSpeed).add(controls.target);controls.update()}else if(e.key.toLowerCase()==='r'){camera.position.set(60,90,135);focusVisible()}else used=false;if(used){S.autoOrbit=false;autoOrbit.classList.remove('active');autoOrbit.textContent='Auto Orbit';e.preventDefault()}},{capture:true});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);resizeMiniMap()});
function animate(){requestAnimationFrame(animate);if(S.autoOrbit){let off=camera.position.clone().sub(controls.target);off.applyAxisAngle(new THREE.Vector3(0,1,0),.006);camera.position.copy(controls.target).add(off)}controls.update();renderer.render(scene,camera);labelRenderer.render(scene,camera)}
applyMoveSpeed();fetch(DATA_URL).then(r=>r.text()).then(load).catch(err=>{console.error(err);hud.textContent='Data load failed.'});animate();
</script>
