<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=8, user-scalable=yes" />
<title>H.A.N.K. Three.js Fork</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#020205;color:#f4f7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#app{position:fixed;inset:0}#top{position:fixed;left:0;right:0;top:0;z-index:10;background:rgba(2,2,5,.92);backdrop-filter:blur(8px);border-bottom:1px solid #1d2335;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}h1{font-size:16px;margin:0 8px 0 0;white-space:nowrap}button,select{background:#111827;color:#f4f7ff;border:1px solid #334155;border-radius:10px;padding:7px 10px;cursor:pointer}button.active{border-color:#7dd3fc;box-shadow:0 0 0 1px rgba(125,211,252,.35) inset}label{font-size:12px;color:#a9b0c2;white-space:nowrap}#info{position:fixed;right:14px;top:62px;width:360px;max-width:calc(100vw - 28px);max-height:calc(100vh - 88px);overflow:auto;z-index:8;background:rgba(9,10,16,.88);border:1px solid #20263a;border-radius:18px;padding:12px 14px;backdrop-filter:blur(10px)}#info h2{font-size:30px;margin:2px 0}.eyebrow{color:#7dd3fc;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.status{color:#a9b0c2;margin-bottom:10px}.detail{display:grid;grid-template-columns:122px 1fr;gap:10px;border-top:1px solid rgba(255,255,255,.08);padding:7px 0;font-size:14px}.detail span:first-child{color:#a9b0c2;font-size:12px}#build{position:fixed;right:10px;top:10px;z-index:100;background:#0f172a;color:#e0f2fe;border:1px solid #7dd3fc;border-radius:9px;padding:4px 7px;font:700 11px system-ui;letter-spacing:.08em;pointer-events:none}#hud{position:fixed;left:14px;bottom:14px;z-index:8;background:rgba(9,10,16,.88);border:1px solid #20263a;border-radius:14px;padding:8px 10px;color:#a9b0c2;font-size:12px;backdrop-filter:blur(10px)}@media(max-width:720px){#info{left:10px;right:10px;top:auto;bottom:58px;width:auto;max-height:190px}#top{padding-right:64px}h1{width:100%}}
</style>
<script async src="https://unpkg.com/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app"></div>
<div id="build">J9X4</div>
<div id="top"><h1>H.A.N.K. Three.js Fork</h1><button id="resetV">Reset view</button><button id="autoOrbit">Auto Orbit</button><label>Display <select id="displayMode"><option value="halfLife" selected>Half-life</option><option value="decayEnergy">Decay energy</option></select></label><label><input id="linksToggle" type="checkbox" checked> decay links</label><label><input id="labelsToggle" type="checkbox" checked> labels</label><label><input id="floorToggle" type="checkbox" checked> opaque floor</label></div>
<div id="info"><div class="eyebrow">Selection</div><h2>None</h2><div class="status">Click a nuclide sphere.</div><div class="detail"><span>Renderer</span><span>Three.js/WebGL with real depth testing.</span></div><div class="detail"><span>Build</span><span>J9X4</span></div></div>
<div id="hud">Loading nuclide data…</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const BUILD='J9X4';
const DATA_URL='https://raw.githubusercontent.com/posit-dev/great-tables/main/great_tables/data/16-nuclides.csv';
const UMEV=931.49410242,E_U=548.579909065,N_U=1008664.91595,H_U=1007825.031898,HE4_U=4002603.25413;
const app=document.getElementById('app'),info=document.getElementById('info'),hud=document.getElementById('hud');
const S={nodes:[],by:new Map(),links:[],displayMode:'halfLife',autoOrbit:false,zScale:5.8,nScale:5.8,yScale:34,maxDecayEnergy:1,selected:null};
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x020205);
scene.fog=new THREE.Fog(0x020205,180,760);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,2500);
camera.position.set(60,90,135);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;app.appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();labelRenderer.setSize(innerWidth,innerHeight);labelRenderer.domElement.style.position='fixed';labelRenderer.domElement.style.inset='0';labelRenderer.domElement.style.pointerEvents='none';app.appendChild(labelRenderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.08;controls.target.set(0,0,0);controls.update();
scene.add(new THREE.HemisphereLight(0xdbeafe,0x111827,1.6));const sun=new THREE.DirectionalLight(0xffffff,1.35);sun.position.set(90,160,80);scene.add(sun);
const root=new THREE.Group(),nodeGroup=new THREE.Group(),linkGroup=new THREE.Group(),floorGroup=new THREE.Group(),labelGroup=new THREE.Group();root.add(linkGroup,floorGroup,nodeGroup,labelGroup);scene.add(root);
const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();
const sphereGeo=new THREE.SphereGeometry(1,24,16);const lineMatCache=new Map();
function parseCSV(t){let rows=[],row=[],cell='',q=false;for(let i=0;i<t.length;i++){let ch=t[i],n=t[i+1];if(q){if(ch==='"'&&n==='"'){cell+='"';i++}else if(ch==='"')q=false;else cell+=ch}else{if(ch==='"')q=true;else if(ch===','){row.push(cell);cell=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&n==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell=''}else cell+=ch}}row.push(cell);if(row.some(v=>v.trim()))rows.push(row);let h=rows.shift().map(v=>v.trim());return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()]))) }
function pct(v){if(v==null||String(v).trim()==='')return '';let n=Number(v);if(!isFinite(n))return String(v);return n<=1?(n*100).toPrecision(4)+'%':n.toPrecision(4)+'%'}
function pctNumber(v){if(!v)return NaN;let n=Number(String(v).replace('%','').trim());if(!isFinite(n))return NaN;return n>1?n/100:n}
function microMass(v){let n=Number(v);return isFinite(n)?(n<1000?n*1e6:n):NaN}
function rowModes(r,stable){if(stable)return[{mode:'Stable',prob:'100%'}];let out=[];for(let i=1;i<=3;i++){let d=(r['decay_'+i]||'').trim();if(d)out.push({mode:d,prob:pct(r['decay_'+i+'_pct'])})}let d=(r.decay||r.decay_1||'').trim();if(!out.length&&d)out.push({mode:d,prob:pct(r.decay_pct||'')});return out.length?out:[{mode:'Unknown / not listed',prob:''}]}
function cleanMode(m){return String(m||'').toLowerCase().replace(/β/g,'b').replace(/\s+/g,'')}
function halfLifeSeconds(n){if(n.stable)return Infinity;let h=Number(n.half);return isFinite(h)&&h>0?h:NaN}
function halfLifeHeight(n){if(n.stable)return 0;let h=halfLifeSeconds(n);if(!isFinite(h))return .55;let log=Math.log10(1+h);return 1-Math.max(0,Math.min(1,log/20))}
function massOf(Z,N){let d=S.by.get(Z+','+N);return d&&isFinite(d.mass)?d.mass:NaN}
function qFrom(n,Z,N,extra=0){let mp=n.mass,md=massOf(Z,N);if(!isFinite(mp)||!isFinite(md))return null;return (mp-md-extra)/1e6*UMEV}
function fmtQ(q){return !isFinite(q)?'':(Math.abs(q)<1?q.toFixed(3):q.toFixed(2))+' MeV'}
function qValsForMode(n,mode){let d=cleanMode(mode),vals=[];function add(Z,N,extra=0){let q=qFrom(n,Z,N,extra);if(q!==null&&isFinite(q)&&q>0)vals.push(q)}if(!d||d==='stable')return vals;if(d.includes('b+p'))add(n.Z-2,n.N+1,H_U+2*E_U);else if(d.includes('b+a'))add(n.Z-3,n.N-1,HE4_U+2*E_U);else if(d.includes('b-2n'))add(n.Z+1,n.N-3,2*N_U);else if(d.includes('b-n'))add(n.Z+1,n.N-2,N_U);else if(d.includes('b-a'))add(n.Z-1,n.N-3,HE4_U);else if(d.includes('b-p'))add(n.Z,n.N-1,H_U);else if(d==='2p')add(n.Z-2,n.N,2*H_U);else if(d==='p')add(n.Z-1,n.N,H_U);else if(d==='2n')add(n.Z,n.N-2,2*N_U);else if(d==='n')add(n.Z,n.N-1,N_U);else if(d==='a'||d==='alpha')add(n.Z-2,n.N-2,HE4_U);else{if(d.includes('ec'))add(n.Z-1,n.N+1,0);if(d.includes('b+')||d.includes('beta+'))add(n.Z-1,n.N+1,2*E_U);if(d.includes('b-')||d.includes('beta-'))add(n.Z+1,n.N-1,0)}return vals}
function modeDecayEnergy(n,mode){let vals=qValsForMode(n,mode);return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:NaN}
function branchWeights(n){let modes=(n.modes&&n.modes.length?n.modes:[]),items=modes.map(m=>({mode:m.mode,prob:pctNumber(m.prob)})),known=items.filter(x=>isFinite(x.prob)&&x.prob>0).reduce((s,x)=>s+x.prob,0);if(known>0){items.forEach(x=>{if(!isFinite(x.prob)||x.prob<=0)x.prob=Math.max(0,(1-known)/(items.length-1||1))})}else items.forEach(x=>x.prob=items.length?1/items.length:0);let total=items.reduce((s,x)=>s+x.prob,0)||1;items.forEach(x=>x.prob=x.prob/total);return items}
function weightedDecayEnergy(n){if(!n||n.stable)return 0;let sum=0,weight=0;for(let item of branchWeights(n)){let e=modeDecayEnergy(n,item.mode);if(isFinite(e)){sum+=e*item.prob;weight+=item.prob}}return weight>0?sum/weight:0}
function heightValue(n){return S.displayMode==='decayEnergy'?Math.max(0,Math.min(1,weightedDecayEnergy(n)/(S.maxDecayEnergy||1))):halfLifeHeight(n)}
function colorFor(n){let h=n.stable?0:275*halfLifeHeight(n);return new THREE.Color().setHSL(h/360,.86,n.stable?.55:.48)}
function lineColor(type){return type==='beta-'?0x28aaff:type==='beta+/ec'?0xff50f0:type==='alpha'?0xff9120:type==='isotope'?0x78a0ff:0xd1d5db}
function posFor(n){return new THREE.Vector3((n.Z-S.centerZ)*S.zScale,heightValue(n)*S.yScale,(n.N-S.centerN)*S.nScale)}
function clearGroup(g){while(g.children.length){let o=g.children.pop();o.geometry?.dispose?.();if(o.material){Array.isArray(o.material)?o.material.forEach(m=>m.dispose?.()):o.material.dispose?.();}}}
function addTextLabel(n){let el=document.createElement('div');el.textContent=n.label;el.style.cssText='color:#f8fafc;font:700 11px system-ui;text-shadow:0 1px 4px #000;white-space:nowrap';let obj=new CSS2DObject(el);obj.position.copy(n.mesh.position).add(new THREE.Vector3(0,2.4,0));labelGroup.add(obj);n.labelObj=obj}
function buildScene(){clearGroup(nodeGroup);clearGroup(linkGroup);clearGroup(floorGroup);while(labelGroup.children.length)labelGroup.remove(labelGroup.children[0]);S.maxDecayEnergy=Math.max(1,...S.nodes.map(weightedDecayEnergy));for(const n of S.nodes){let p=posFor(n);let mat=new THREE.MeshStandardMaterial({color:colorFor(n),roughness:.55,metalness:.12});let m=new THREE.Mesh(sphereGeo,mat);m.scale.setScalar(n.stable?1.15:.9);m.position.copy(p);m.userData.node=n;n.mesh=m;nodeGroup.add(m);if(labelsToggle.checked)addTextLabel(n)}buildFloor();buildLinks();hud.textContent=`Build ${BUILD} · ${S.nodes.length.toLocaleString()} nuclides · WebGL depth testing is active.`}
function buildFloor(){clearGroup(floorGroup);let minZ=Math.min(...S.nodes.map(n=>n.Z))-.5,maxZ=Math.max(...S.nodes.map(n=>n.Z))+.5,minN=Math.min(...S.nodes.map(n=>n.N))-.5,maxN=Math.max(...S.nodes.map(n=>n.N))+.5;let w=(maxZ-minZ)*S.zScale,d=(maxN-minN)*S.nScale;let slabGeo=new THREE.PlaneGeometry(w,d);let slabMat=new THREE.MeshStandardMaterial({color:0x050713,side:THREE.DoubleSide,transparent:false,depthWrite:true,depthTest:true,roughness:.8});let slab=new THREE.Mesh(slabGeo,slabMat);slab.rotation.x=-Math.PI/2;slab.position.set(((minZ+maxZ)/2-S.centerZ)*S.zScale,-.03,((minN+maxN)/2-S.centerN)*S.nScale);floorGroup.add(slab);for(const n of S.nodes){let geo=new THREE.PlaneGeometry(S.zScale*.92,S.nScale*.92);let mat=new THREE.MeshStandardMaterial({color:colorFor(n),side:THREE.DoubleSide,transparent:false,depthWrite:true,depthTest:true,roughness:.72});let cell=new THREE.Mesh(geo,mat);cell.rotation.x=-Math.PI/2;cell.position.set((n.Z-S.centerZ)*S.zScale,.015,(n.N-S.centerN)*S.nScale);floorGroup.add(cell)}}
function addLine(a,b,type){let key=type,mat=lineMatCache.get(key);if(!mat){mat=new THREE.LineBasicMaterial({color:lineColor(type),transparent:true,opacity:type==='isotope'?.28:.72,depthTest:true,depthWrite:false});lineMatCache.set(key,mat)}let geo=new THREE.BufferGeometry().setFromPoints([a.mesh.position,b.mesh.position]);let line=new THREE.Line(geo,mat);linkGroup.add(line)}
function buildLinks(){clearGroup(linkGroup);let seen=new Set();function add(a,b,type){if(!a||!b)return;let k=a.key+'|'+b.key+'|'+type,kr=b.key+'|'+a.key+'|'+type;if(seen.has(k)||seen.has(kr))return;seen.add(k);addLine(a,b,type)}for(const n of S.nodes){add(n,S.by.get(n.Z+','+(n.N+1)),'isotope');if(n.stable)continue;for(const mode of n.modes){let d=cleanMode(mode.mode);if(!d||d==='stable')continue;if(d.includes('b-')||d.includes('beta-'))add(n,S.by.get((n.Z+1)+','+(n.N-1)),'beta-');if(d.includes('ec')||d.includes('b+')||d.includes('beta+'))add(n,S.by.get((n.Z-1)+','+(n.N+1)),'beta+/ec');if(d==='a'||d==='alpha')add(n,S.by.get((n.Z-2)+','+(n.N-2)),'alpha')}}linkGroup.visible=linksToggle.checked}
function showInfo(n){S.selected=n;if(!n){info.innerHTML='<div class="eyebrow">Selection</div><h2>None</h2><div class="status">Click a nuclide sphere.</div><div class="detail"><span>Renderer</span><span>Three.js/WebGL with real depth testing.</span></div><div class="detail"><span>Build</span><span>'+BUILD+'</span></div>';return}let q=weightedDecayEnergy(n);info.innerHTML=`<div class="eyebrow">Element: ${n.el}</div><h2>${n.label}</h2><div class="status">${n.stable?'Stable isotope':'Radioactive isotope'}</div><div class="detail"><span>Protons Z</span><span>${n.Z}</span></div><div class="detail"><span>Neutrons N</span><span>${n.N}</span></div><div class="detail"><span>Mass A</span><span>${n.A}</span></div><div class="detail"><span>Half-life</span><span>${n.stable?'Stable':n.half||'—'}</span></div><div class="detail"><span>Display</span><span>${S.displayMode==='decayEnergy'?'Decay energy':'Half-life'}</span></div><div class="detail"><span>Weighted decay energy</span><span>${q>0?fmtQ(q):'—'}</span></div><div class="detail"><span>Decay modes</span><span>${n.modes.map(m=>m.mode+(m.prob?' '+m.prob:'')).join('<br>')}</span></div><div class="detail"><span>Build</span><span>${BUILD}</span></div>`}
function load(text){let rows=parseCSV(text),seen=new Set();S.nodes=[];S.by=new Map();for(let r of rows){let Z=+r.z,N=+r.n,A=Z+N,sym=r.element,el=sym,stableText=r.is_stable,decay=r.decay_1||'',half=r.half_life||'',mass=microMass(r.atomic_mass);if(!isFinite(Z)){Z=+r.Z;N=+r.N;A=+r.A||Z+N;sym=r.symbol;el=r.element||sym;stableText=r.stable;decay=r.decay||'';half=r.half_life||'';mass=microMass(r.atomic_mass||r.mass)}if(!sym||!isFinite(Z)||!isFinite(N)||Z<0||N<0)continue;let key=Z+','+N;if(seen.has(key))continue;seen.add(key);let stable=/true|yes|stable/i.test(stableText)||/^stable$/i.test(decay);if(stable){decay='Stable';half='Stable'}let node={Z,N,A,sym,el,stable,decay,half,mass,modes:rowModes(r,stable),key,label:sym+'-'+A};S.nodes.push(node);S.by.set(key,node);S.by.set(node.label,node)}S.centerZ=(Math.min(...S.nodes.map(n=>n.Z))+Math.max(...S.nodes.map(n=>n.Z)))/2;S.centerN=(Math.min(...S.nodes.map(n=>n.N))+Math.max(...S.nodes.map(n=>n.N)))/2;buildScene();controls.target.set(0,0,0);camera.position.set(60,90,135);controls.update()}
renderer.domElement.addEventListener('pointerdown',e=>{mouse.x=(e.clientX/innerWidth)*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(mouse,camera);let hits=raycaster.intersectObjects(nodeGroup.children,false);if(hits.length)showInfo(hits[0].object.userData.node)});
resetV.onclick=()=>{camera.position.set(60,90,135);controls.target.set(0,0,0);controls.update()};
autoOrbit.onclick=()=>{S.autoOrbit=!S.autoOrbit;autoOrbit.classList.toggle('active',S.autoOrbit);autoOrbit.textContent=S.autoOrbit?'Stop Auto Orbit':'Auto Orbit'};
displayMode.onchange=()=>{S.displayMode=displayMode.value;buildScene();showInfo(S.selected)};
linksToggle.onchange=()=>linkGroup.visible=linksToggle.checked;
labelsToggle.onchange=()=>buildScene();
floorToggle.onchange=()=>floorGroup.visible=floorToggle.checked;
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight)});
function animate(){requestAnimationFrame(animate);if(S.autoOrbit){let off=camera.position.clone().sub(controls.target);off.applyAxisAngle(new THREE.Vector3(0,1,0),.006);camera.position.copy(controls.target).add(off)}controls.update();renderer.render(scene,camera);labelRenderer.render(scene,camera)}
fetch(DATA_URL).then(r=>r.text()).then(load).catch(err=>{console.error(err);hud.textContent='Data load failed.'});animate();
</script>
</body>
</html>
